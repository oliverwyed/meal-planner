name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main, v2, claude/deploy-vercel-v2-F7pwA, claude/brainstorm-app-ideas-1zykJ]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set Supabase secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --project-ref ejinmxvbeaolypwmkuhh

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy import-recipe \
            --project-ref ejinmxvbeaolypwmkuhh \
            --no-verify-jwt
          supabase functions deploy get-nutrition \
            --project-ref ejinmxvbeaolypwmkuhh \
            --no-verify-jwt
          supabase functions deploy suggest-meals \
            --project-ref ejinmxvbeaolypwmkuhh \
            --no-verify-jwt
          supabase functions deploy adapt-recipe \
            --project-ref ejinmxvbeaolypwmkuhh \
            --no-verify-jwt
          supabase functions deploy parse-recipe-photo \
            --project-ref ejinmxvbeaolypwmkuhh \
            --no-verify-jwt
          supabase functions deploy generate-event-schedule \
            --project-ref ejinmxvbeaolypwmkuhh \
            --no-verify-jwt
