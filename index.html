 steps:["Preheat oven to 220°C / 200°C fan — the highest reasonable heat is what produces crispy skin rather than leathery or soft skin. Scrub potatoes clean and dry thoroughly.","Prick each potato all over with a fork (at least 8 pricks per potato — unpicked potatoes can burst). Rub all over with a little oil and a generous pinch of flaky salt.","Place directly on the oven rack, not a tray — hot air circulating underneath is what crisps the skin all around rather than leaving the base soggy. Bake for 40–45 min until the skin is shatteringly crisp and a skewer slides in with no resistance.","While potatoes bake, drain and flake the tuna; mix with mayo and season well. Heat beans in a small pan until bubbling. Grate the cheddar.","Remove from the oven and immediately cut a deep cross in each potato. Squeeze the sides to open up the centre, then add a knob of butter. Fill generously."],
 tip:"Baking the potatoes directly on the oven rack (not on a tray) allows hot air to circulate underneath — baking on a tray traps steam under the potato and prevents the base from crisping."},

{name:"Paprika Chicken Drumstick & Baby Potato Traybake",time:"35 min",minutes:35,protein:"chicken",cuisine:"british",seasons:["autumn","winter"],carb:"potato",serves:4,
 description:"Golden, paprika-rubbed drumsticks and caramelised potatoes, peppers and courgette — all roasted together in one tray until everything is sticky at the edges and fragrant with garlic. Minimal effort, maximum reward.",kidNote:"Drumsticks are natural finger food — children can hold the bone and eat directly, which they tend to love",
 ingredients:["8 chicken drumsticks","500g baby potatoes","2 peppers","1 courgette","2 tbsp olive oil","1 tsp garlic granules","1 tsp smoked paprika"],
 steps:["Preheat oven to 220°C / 200°C fan. Halve baby potatoes; cut peppers into chunky strips and dice courgette into 2cm pieces. Dry the drumsticks thoroughly with kitchen paper.","In a large roasting tin, toss the potatoes with 1 tbsp olive oil, garlic granules, half the paprika, salt and pepper until evenly coated.","Rub the drumsticks with the remaining oil, paprika, salt and pepper. Nestle them among the potatoes in the tin, skin-side up, with space around each one.","Roast for 20 min. Add peppers and courgette to the tin, toss with the pan juices, and return for a further 15 min until the chicken skin is deep golden and the vegetables are tender and caramelised at the edges.","Check the chicken is cooked through — the juices should run completely clear when the thickest part of a drumstick is pierced with a skewer. Serve from the tray."],
 tip:"Patting the drumsticks dry and giving them space in the tin — rather than packing them tightly — allows the oven's heat to circulate and the skin to roast rather than steam, which is the difference between crispy and flabby."},

{name:"Smoky Beef Taco Night with Cheese, Salsa & Sour Cream",time:"25 min",minutes:25,protein:"beef",cuisine:"mexican",seasons:["spring","summer"],carb:"bread",serves:4,
 description:"Richly spiced, deeply savoury beef mince spooned into crunchy shells and topped with sharp cheddar, cool sour cream and fresh salsa — a table-centre meal that everyone customises and nobody complains about.",kidNote:"For toddlers, break the taco shell and serve the mince in a bowl with cheese and mild salsa — the filling is what they love anyway",
 ingredients:["400g beef mince","8 taco shells","1 pack taco seasoning","1 little gem lettuce","80g cheddar cheese","4 tbsp salsa","4 tbsp sour cream"],
 steps:["Heat a wide pan over high heat with no oil — the mince has enough fat. Add the beef mince and spread flat. Leave untouched for 2 min until the underside is deeply browned, then break up with a spoon and stir, cooking a further 3 min until all the mince is brown, not grey.","Tilt the pan and spoon away any excess fat — a dry, seasoned mince is more flavourful than one sitting in grease.","Add taco seasoning and 4 tbsp water; stir and simmer over medium heat for 5 min until the liquid absorbs and the mince is glossy and well-coated.","Warm taco shells per pack (usually 2–3 min in a hot oven). Shred the lettuce; grate the cheddar. Set everything out in the middle of the table.","Let everyone fill their own shells. The order matters: shell, mince, cheese (so it melts), then lettuce, salsa and sour cream on top."],
 tip:"Browning the mince without stirring for the first couple of minutes — then draining the fat — concentrates the beef flavour and prevents the taco filling from being greasy and wet."},

{name:"Mild Chickpea & Sweet Potato Coconut Curry with Naan",time:"30 min",minutes:30,protein:"veggie",cuisine:"indian",seasons:["autumn","winter"],carb:"bread",serves:4,
 description:"Creamy, gently spiced coconut curry with soft sweet potato and hearty chickpeas, wilted through with spinach and served with warm, pillowy naan for tearing and dipping. Warming, comforting and completely plant-based.",kidNote:"Mild and naturally sweet from the coconut and sweet potato — a curry most young children take to readily",
 ingredients:["2 tins chickpeas","2 sweet potatoes","400g tin coconut milk","2 tbsp korma paste","100g spinach","4 naan breads","250g rice"],
 steps:["Cook rice per pack instructions. Peel and dice sweet potato into 1.5cm cubes — try to keep them even so they cook at the same rate. Microwave with a splash of water for 4 min until just tender but holding their shape.","Heat a dry large pan over medium heat. Add korma paste and fry, stirring constantly, for 1–2 min until fragrant and slightly deepened in colour — frying the paste in a dry pan wakes up the spices before the liquid goes in.","Add the diced sweet potato and drained chickpeas to the pan; stir to coat in the paste.","Pour in the coconut milk and stir well. Bring to a gentle simmer over medium heat and cook for 12–15 min, stirring occasionally, until the sauce has thickened slightly and the sweet potato is completely tender.","Add the spinach in large handfuls, stirring between additions, and cook for 1–2 min until wilted. Taste and season with salt. Warm naan breads in the oven or microwave and serve alongside."],
 tip:"Frying the korma paste in a dry pan for a full minute or two before adding any liquid — until it smells fragrant and deepens slightly — is the step that takes curry from flat and mild to genuinely aromatic."},

{name:"Baked Beef Ragù Rigatoni with Mozzarella",time:"40 min",minutes:40,protein:"beef",cuisine:"italian",seasons:["autumn","winter"],carb:"pasta",serves:4,
 description:"Rigatoni tubes packed with rich, herby beef ragu and topped with torn mozzarella that goes blistered and golden in the oven — the baked pasta dish that earns its place on the weekend table every single time.",kidNote:"Scatter extra cheese generously over individual children's portions before the dish goes under the grill — a thick, golden cheese crust is often what wins over reluctant eaters",
 ingredients:["400g rigatoni","400g beef mince","400g tin chopped tomatoes","125g mozzarella","1 onion","1 tsp dried oregano","1 tbsp olive oil"],
 steps:["Preheat oven to 200°C / 180°C fan. Finely dice the onion. Heat olive oil in a wide pan over medium heat and soften the onion for 3–4 min, stirring, until translucent and smelling sweet.","Increase heat to high. Add the beef mince and flatten across the pan — leave undisturbed for 2 min to develop a deep brown crust, then break up and continue cooking until no pink remains and the mince is properly browned, not just grey.","Add the chopped tomatoes, oregano, a generous amount of salt and plenty of black pepper. Simmer over medium heat for 10 min, stirring occasionally, until the sauce has thickened and deepened in flavour.","Cook rigatoni in well-salted water for 2 min less than the pack instructions — it will finish in the oven. Drain and toss with the sauce in a large baking dish.","Tear mozzarella into rough pieces and scatter over the top. Bake for 15–20 min until the mozzarella is golden and blistered and the sauce is bubbling at the edges. Rest 5 min before serving."],
 tip:"Undercooking the rigatoni by 2 minutes before baking is essential — pasta that's fully cooked before going into the oven overcooks and turns soft and stodgy as it bakes in the sauce."},

{name:"Honey & Soy Sticky Chicken Drumsticks with Rice",time:"35 min",minutes:35,protein:"chicken",cuisine:"asian",seasons:["spring","summer"],carb:"rice",serves:4,
 description:"Caramelised drumsticks glazed in a sticky honey, soy and ketchup lacquer that clings in dark, sweet shards to the crispy skin — served with fluffy rice and tender broccoli. Fingers will be licked.",kidNote:"The sweet glaze makes these very appealing to children — bring plenty of napkins and lean into the mess",
 ingredients:["8 chicken drumsticks","2 tbsp honey","2 tbsp soy sauce","1 tbsp ketchup","250g rice","1 head broccoli"],
 steps:["Preheat oven to 200°C / 180°C fan. Pat drumsticks completely dry with kitchen paper — this is the critical step for crispy skin and a glaze that sticks rather than slides off.","Mix honey, soy sauce and ketchup in a bowl until combined. Season with black pepper (the soy provides the salt). Toss the drumsticks in the marinade until evenly coated.","Arrange drumsticks in a roasting tin with space between each one — touching drumsticks steam each other rather than caramelising. Roast for 20 min.","Spoon any glaze pooled in the tin back over the drumsticks. Return to the oven for 12–15 min more until the glaze is deeply caramelised and the skin is lacquered and sticky. The juices should run clear.","Cook rice per pack. Break broccoli into small florets and steam or boil for 4–5 min until just tender. Serve everything alongside."],
 tip:"Basting the drumsticks halfway through with the pooled glaze in the tin builds up the lacquered, sticky layers — each baste adds another coat of caramelised flavour rather than leaving a thin, watery finish."},

{name:"Thai Green Coconut Chicken Curry with Jasmine Rice",time:"30 min",minutes:30,protein:"chicken",cuisine:"asian",seasons:["spring","summer"],carb:"rice",serves:4,
 description:"Silky coconut milk curry fragrant with lemongrass, galangal and green chilli — with tender chicken and sweet peas, served over jasmine rice that soaks up every drop of the sauce. Light yet deeply satisfying.",kidNote:"Use a mild Thai green paste for young children — the coconut milk tempers the heat but taste before serving",
 ingredients:["3 chicken breasts","400g tin coconut milk","2 tbsp Thai green curry paste","150g frozen peas","250g jasmine rice","1 tbsp vegetable oil","1 lime"],
 steps:["Cook jasmine rice per pack instructions and keep warm.","Slice chicken breasts into bite-sized pieces, roughly 3cm — even sizes mean they cook at the same rate. Season lightly with salt.","Heat oil in a wide pan or wok over medium-high heat. Add the chicken pieces in a single layer and cook for 3–4 min until lightly golden. Remove and set aside.","Add the curry paste to the pan and fry, stirring constantly, for 1–2 min until deeply fragrant — you'll smell the lemongrass and spices bloom. This step is what gives the curry its depth.","Pour in coconut milk, scraping up any paste from the pan base. Add the chicken back and simmer gently for 8–10 min until cooked through. Add peas in the last 3 min. Squeeze in half the lime, taste and adjust seasoning. Serve over rice with remaining lime wedges."],
 tip:"Frying the curry paste in a dry pan for a full 1–2 minutes before adding coconut milk releases the essential oils in the spices and aromatics, giving you a fragrant, layered curry rather than a one-dimensional one."},

{name:"Lemon Roasted Salmon with New Potatoes & Courgette",time:"30 min",minutes:30,protein:"fish",cuisine:"british",seasons:["spring","summer"],carb:"potato",serves:4,
 description:"Salmon fillets roasted to just-done perfection on a tray of caramelised new potatoes, sweet cherry tomatoes and tender courgette, all finished with a squeeze of lemon. Spring and summer on a single tray.",kidNote:"Everything is soft and mild — flake the salmon away from the skin into smaller pieces for young children",
 ingredients:["4 salmon fillets","500g new potatoes","2 courgettes","200g cherry tomatoes","2 tbsp olive oil","1 lemon","1 tsp garlic granules"],
 steps:["Preheat oven to 200°C / 180°C fan. Halve new potatoes and toss in a large baking tray with 1 tbsp olive oil, garlic granules, salt and pepper. Roast for 15 min until starting to turn golden.","Dice courgettes into 2cm pieces. Add courgette and cherry tomatoes to the tray, tossing with the potatoes and pan juices.","Pat the salmon fillets dry — dry fish is what gives you a golden, slightly caramelised surface rather than pale, steamed fish. Lay skin-side down on the tray among the vegetables. Drizzle with remaining olive oil and season with salt and pepper.","Squeeze half the lemon over everything. Roast for a further 12–15 min until the salmon is just cooked through — it should be opaque all the way through but still slightly yielding when pressed.","Squeeze over the remaining lemon and serve straight from the tray."],
 tip:"Salmon is done the moment it turns opaque all the way through — a minute or two beyond this and it becomes dry and chalky; check at 12 minutes and remove it the moment it resists slightly when pressed in the thickest part."},

{name:"Smoky Tomato & Pepper Shakshuka with Crusty Bread",time:"25 min",minutes:25,protein:"eggs",cuisine:"middleeastern",seasons:["spring","summer"],carb:"bread",serves:4,
 description:"Eggs nestled into a vivid, aromatic sauce of slow-cooked peppers, onion and spiced tomatoes — the whites just set, the yolks still running golden when you break them with bread. A dish that looks spectacular and asks almost nothing of you.",kidNote:"Eggs in a mild sauce with bread for dipping is a combination that works brilliantly for children — set firm if small children prefer their eggs fully cooked",
 ingredients:["6 eggs","2 tins chopped tomatoes","2 peppers","1 onion","2 tsp smoked paprika","1 tsp cumin","1 tbsp olive oil","bread for serving"],
 steps:["Finely dice the onion; slice peppers into long strips. Heat olive oil in a wide, lidded pan over medium heat. Cook onion and peppers together, stirring occasionally, for 8–10 min until very soft, sweet and beginning to caramelise — take your time here, this is where the flavour base is built.","Add smoked paprika and cumin; stir constantly for 1 min until the spices are fragrant and coated onto the vegetables.","Pour in the chopped tomatoes; season generously with salt, pepper and a pinch of sugar if the tomatoes seem sharp. Simmer over medium heat for 10 min, stirring occasionally, until the sauce has thickened and is deeply coloured.","Taste the sauce and adjust seasoning — it should be robustly flavoured. Make six shallow wells with the back of a spoon. Crack one egg carefully into each well.","Cover the pan with a lid and cook over low-medium heat for 5–8 min. Check at 5 min — the whites should be just set and opaque but the yolks still soft and runny. Serve straight from the pan with plenty of crusty bread."],
 tip:"Covering the pan with a lid (not foil) traps steam that gently sets the whites from above without overcooking the yolks — remove the lid at exactly the right moment for the classic set-white, runny-yolk result."},

{name:"Pulled Spiced Chicken Tacos with Lime Slaw",time:"35 min",minutes:35,protein:"chicken",cuisine:"mexican",seasons:["spring","summer"],carb:"bread",serves:4,
 description:"Thighs cooked until the meat shreds effortlessly into spiced, juicy ribbons, piled into warm soft tacos with sharp lime slaw, salsa and cool sour cream. The kind of assembly meal where everyone at the table is happy.",kidNote:"Soft tacos and mild shredded chicken are ideal for young children — provide toppings separately so they can choose",
 ingredients:["6 chicken thighs","1 pack taco seasoning","8 soft tacos","200g white cabbage","1 lime","4 tbsp sour cream","4 tbsp salsa","1 tbsp vegetable oil"],
 steps:["Season chicken thighs generously all over with taco seasoning, pressing it into both sides.","Heat oil in a wide pan over medium-high heat. Cook thighs skin-side down for 6–7 min without moving until the skin is golden and the fat has rendered. Flip and cook for 6–7 min more until completely cooked through — the juices must run clear, not pink.","Transfer to a plate and rest for 5 min — this is the step that keeps the meat juicy rather than dry when you shred it. Resting allows the juices to settle back into the meat.","While chicken rests, finely shred the cabbage with a sharp knife or mandoline. Toss with the juice of the whole lime and a pinch of salt; set aside. The lime gently softens the cabbage.","Shred the chicken using two forks, pulling against the grain of the meat. Warm tacos in the microwave for 30 seconds wrapped in damp kitchen paper. Build tacos: chicken, then slaw, salsa and sour cream on top."],
 tip:"Resting the cooked chicken thighs for at least 5 minutes before shredding allows the internal juices to redistribute — shredding immediately means all those juices run out onto the board instead of staying in the meat."},

{name:"Vivid Green Pea & Ham Soup with Crusty Bread",time:"20 min",minutes:20,protein:"pork",cuisine:"british",seasons:["autumn","winter"],carb:"bread",serves:4,
 description:"Vivid, sweet frozen peas blended into a velvet-smooth, brilliant green soup with a swirl of cream and salty torn ham — a colour that makes it feel almost impossibly fresh for something so quick to make.",kidNote:"Bright green, creamy and very mild — most children find this genuinely appealing; the colour is half the appeal",
 ingredients:["500g frozen peas","200g ham slices","1 onion","750ml chicken stock","100ml double cream","1 tbsp butter","bread for serving"],
 steps:["Finely dice the onion. Melt butter in a large saucepan over medium heat and cook the onion, stirring, for 3–4 min until completely soft and translucent but not coloured — any browning will muddy the brilliant green colour of the finished soup.","Add the chicken stock and bring to a simmer. Add the frozen peas — don't defrost them first, they cook instantly and the cold helps preserve the vivid colour.","Simmer for 3–4 min until the peas are completely tender. Blend immediately with a stick blender (or in a jug blender in batches) until completely smooth.","Pass through a sieve if you want a very silky result. Season generously with salt and white pepper — peas need salt to taste of themselves. Stir in most of the cream.","Tear the ham into rough pieces and stir through. Serve in bowls with a swirl of remaining cream and crusty bread alongside."],
 tip:"Blending the soup immediately while it's very hot — and serving or cooling it fast — is what preserves the vivid green colour; letting it sit on the heat after blending turns it a dull, khaki colour within minutes."},

{name:"Creamy Chicken & Mushroom Stroganoff with Rice",time:"35 min",minutes:35,protein:"chicken",cuisine:"british",seasons:["autumn","winter"],carb:"rice",serves:4,
 description:"Tender strips of chicken and earthy chestnut mushrooms in a rich, paprika-dusted sour cream sauce — the kind of dish that makes everyone go back for seconds. Indulgent yet genuinely simple to pull together.",kidNote:"Blend or finely chop the mushrooms before adding for children who dislike their texture — stirred into the creamy sauce they become invisible while keeping all the flavour",
 ingredients:["4 chicken breasts","300g chestnut mushrooms","1 onion","200ml sour cream","1 tbsp plain flour","1 tbsp smoked paprika","2 tbsp vegetable oil","1 tsp Dijon mustard","250g rice"],
 steps:["Cook rice per pack instructions and keep warm. Slice chicken breasts into long thin strips, roughly 1cm wide — uniform sizing ensures even cooking. Season generously with salt, pepper and half the paprika.","Heat 1 tbsp oil in a wide pan over high heat. Fry chicken strips in a single layer without moving for 2 min to colour, then toss and cook 2 min more until golden and just cooked through. Remove and set aside — cooking in batches if needed so the pan stays hot.","Finely dice the onion. Add the remaining oil to the same pan over medium heat and cook onion for 3–4 min until soft and translucent. Slice mushrooms thickly and add; cook over medium-high heat for 5–6 min until their moisture has fully evaporated and the edges start to colour.","Stir in the flour and remaining paprika; cook for 1 min. Remove the pan from the heat and stir in the sour cream and Dijon mustard until smooth — adding it off the heat prevents the sauce from splitting.","Return to low heat, add the chicken back, and stir gently to combine. Simmer on low for 3–4 min until the sauce is glossy and coats everything. Taste and adjust seasoning. Serve over rice."],
 tip:"Adding sour cream off the heat — or over the gentlest possible heat — stops it splitting into grainy curds; high heat causes the proteins to seize and the sauce loses its silky texture immediately."},

{name:"Saucy Onion Gravy Beef Meatballs with Crushed Potatoes",time:"35 min",minutes:35,protein:"beef",cuisine:"british",seasons:["autumn","winter"],carb:"potato",serves:4,
 description:"Golden, herb-flecked beef meatballs simmered in a deeply savoury, sticky onion gravy until they're almost falling apart — spooned over rough-crushed buttery potatoes. British comfort food at its most honest.",kidNote:"Round, saucy and easy to eat with a fork — children enjoy spearing each meatball individually",
 ingredients:["500g beef mince","600g potatoes","2 onions","400ml beef stock","2 tbsp plain flour","1 tbsp Worcestershire sauce","1 tsp dried mixed herbs","2 tbsp vegetable oil","30g butter"],
 steps:["Peel and dice potatoes into even chunks. Boil in well-salted water for 18–20 min until completely tender when pierced. Drain thoroughly, return to the pan with the butter, and crush roughly with a fork — leave them textured and chunky rather than smooth. Season generously with salt and pepper.","Combine mince with the dried herbs, a generous pinch of salt and plenty of black pepper. Mix until just combined — overworking makes meatballs dense and tough. Roll into 20 even balls, roughly the size of a large marble.","Heat 1 tbsp oil in a wide, heavy pan over medium-high heat. Brown the meatballs in batches with space between each, turning every 2 min, until deeply golden all over — about 6–8 min total. Remove and set aside. The browned bits left in the pan are pure flavour.","Slice onions into thin half-moons. Add the remaining oil to the same pan over medium heat and cook onions, stirring frequently, for 8–10 min until very soft, sweet and deeply golden. Stir in the flour and cook for 1 min.","Gradually add the beef stock and Worcestershire sauce, stirring constantly to prevent lumps. Bring to a gentle simmer. Return meatballs to the pan; simmer for 8–10 min until the gravy coats the back of a spoon and the meatballs are cooked through. Serve over crushed potatoes."],
 tip:"The browned bits (fond) left in the pan after frying the meatballs are the foundation of the gravy's colour and flavour — dissolve them into the stock by scraping the pan base as you stir."},

{name:"Herby Pork Gnocchi Bolognese",time:"30 min",minutes:30,protein:"pork",cuisine:"italian",seasons:["autumn","winter"],carb:"potato",serves:4,
 description:"Pillowy gnocchi tossed through a quick, fennel-scented pork ragù — richer and more interesting than a standard bolognese, with the gnocchi soaking up the sauce from the inside. A clever twist on the family staple.",kidNote:"Soft pillowy gnocchi in a saucy meat ragù is very approachable — cut into halves for toddlers to make them easier to manage",
 ingredients:["400g pork mince","500g gnocchi","400g tin chopped tomatoes","1 onion","1 carrot","1 tsp dried mixed herbs","1 tsp fennel seeds","1 tbsp olive oil","30g parmesan"],
 steps:["Finely dice the onion and carrot into small, even pieces. Heat olive oil in a wide pan over medium heat and cook, stirring occasionally, for 4–5 min until softened and smelling sweet.","Add fennel seeds and stir for 30 seconds until fragrant. Increase heat to high, add pork mince and press flat across the pan — leave undisturbed for 2 min to develop colour, then break up and cook until no pink remains and the mince is beginning to caramelise, about 4 min more.","Add chopped tomatoes, mixed herbs, a generous amount of salt and plenty of black pepper. Stir well and simmer over medium heat for 12 min, stirring occasionally, until the sauce has thickened and the tomatoes have broken down into a deep, rich ragù.","Cook gnocchi in a large pan of well-salted boiling water — they're ready 30 seconds after they float to the surface. Reserve a mug of pasta water, then drain.","Add gnocchi to the ragù with a splash of pasta water; toss gently to coat — the starchy water helps the sauce cling. Taste and adjust seasoning. Serve with finely grated parmesan."],
 tip:"Fennel seeds are what give Italian sausage its distinctive character — add them to plain pork mince and you get that same depth of flavour without using sausages at all."},

{name:"Sticky Tamarind Pork & Udon Noodle Bowl",time:"30 min",minutes:30,protein:"pork",cuisine:"asian",carb:"noodles",serves:4,
 description:"Thick udon noodles tossed with caramelised pork strips in a sticky, tangy-sweet tamarind and soy glaze, finished with crunchy spring onions and toasted sesame seeds. A bowl that tastes as exciting as it looks.",kidNote:"Tamarind is gently sweet-sour rather than sharp — reduce the quantity by half and taste before serving for young children",
 ingredients:["400g pork tenderloin or loin steaks","300g udon noodles","2 tbsp tamarind paste","2 tbsp soy sauce","1 tbsp honey","1 tbsp sesame oil","1 tbsp vegetable oil","4 spring onions","1 tbsp sesame seeds","1 tsp garlic granules"],
 steps:["Mix tamarind paste, soy sauce, honey and garlic granules in a small bowl until smooth — taste it and adjust: it should be boldly sweet, sour and salty in balance. Set aside.","Slice pork into thin strips, about 5mm thick and 5cm long. Pat completely dry with kitchen paper — any surface moisture creates steam in the pan and prevents caramelisation.","Cook udon noodles per pack instructions (usually 2 min in boiling water). Drain and toss immediately with the sesame oil to prevent sticking. Set aside.","Heat vegetable oil in a wok over the highest heat possible until just starting to smoke. Add pork strips in a single layer — do not stir for 90 seconds so they sear and caramelise. Toss and cook 2 min more until cooked through and golden at the edges.","Pour the tamarind sauce over the pork; toss vigorously for 1 min until the sauce reduces and coats every strip in a glossy lacquer. Add udon noodles and toss over high heat for 1 min until evenly coated and steaming. Serve topped with sliced spring onions and sesame seeds."],
 tip:"Letting the pork sit untouched for 90 seconds before tossing creates the caramelised surface that the tamarind glaze grips onto — stir immediately and you get pale, steamed pork with no crust for the sauce to cling to."},

{name:"Steamed Mussels in White Wine, Garlic & Cream with Sourdough",time:"25 min",minutes:25,protein:"seafood",cuisine:"british",carb:"bread",serves:4,adult:true,seasons:["spring","summer"],
 description:"A pot of glistening, just-opened mussels in a fragrant broth of white wine, cream, garlic and shallots — brought to the table with thick sourdough for mopping every last drop. Communal, convivial, and effortlessly impressive.",kidNote:"",
 ingredients:["2kg fresh mussels","250ml dry white wine","150ml double cream","4 shallots","4 garlic cloves","40g butter","small bunch flat-leaf parsley","1 lemon","1 sourdough loaf"],
 steps:["Rinse mussels under cold running water. Pull away any beards. Tap any open mussels firmly — discard those that stay open and any with cracked shells.","Finely slice the shallots and garlic. Melt butter in a very large, heavy pan or stockpot over medium heat. Cook shallots and garlic for 3–4 min until completely soft and translucent but not coloured.","Increase heat to high and pour in the wine — it should sizzle hard. Cook for 2 min until the sharpness has cooked off and it smells mellow and fragrant.","Add the mussels and cream. Cover immediately with a tight-fitting lid. Cook for 3–5 min, shaking the pan once halfway through, until all mussels have opened. Discard any that remain firmly closed.","Scatter roughly chopped parsley over the pan. Squeeze over lemon, taste the broth and season. Bring the pot to the table with torn sourdough alongside."],
 tip:"Once the lid goes on, resist opening it — the mussels cook in concentrated steam and every time you lift the lid you release heat and extend cooking time, making the mussels tough and rubbery."},

{name:"Lamb Cutlets with Herby Salsa Verde & Roasted Cherry Tomatoes",time:"30 min",minutes:30,protein:"lamb",cuisine:"middleeastern",carb:"none",serves:4,adult:true,seasons:["spring","summer"],
 description:"French-trimmed lamb cutlets with their fat rendered to a crisp golden edge, served alongside sweet, collapsing roasted cherry tomatoes and a punchy, herb-heavy salsa verde. The kind of dinner that makes a Tuesday evening feel like a summer holiday.",kidNote:"",
 ingredients:["12 French-trimmed lamb cutlets","400g cherry tomatoes","large bunch flat-leaf parsley","small bunch mint","2 tbsp capers","2 anchovy fillets","3 garlic cloves","1 lemon","6 tbsp olive oil","1 tbsp red wine vinegar"],
 steps:["Preheat oven to 200°C / 180°C fan. Toss cherry tomatoes in a roasting tin with 1 tbsp olive oil, salt and pepper. Roast for 20 min until collapsing and caramelised at the edges.","Make the salsa verde: finely chop parsley leaves, mint, capers, anchovies and 2 garlic cloves together until rough and green-flecked. Stir in 4 tbsp olive oil, red wine vinegar and lemon juice; season firmly. It should be assertive, punchy and bright.","Pat lamb cutlets completely dry and season generously on both sides.","Heat remaining olive oil in a heavy pan over very high heat. Stand the cutlets fat-side down in the pan and press for 2 min until the fat is rendered and golden. Lay flat and cook 2–3 min per side for medium-rare, basting with the rendered fat.","Rest 4 min before plating. Serve with roasted tomatoes and a generous spoonful of salsa verde, the rest in a bowl alongside."],
 tip:"Rendering the fat cap first — by standing cutlets fat-side down — is the step that takes lamb from pale and fatty to crisp-edged and deeply flavoured; rush this step and the fat stays chewy and unpleasant."},

{name:"Roast Pork Tenderloin with Wholegrain Mustard Cream & Wilted Spinach",time:"30 min",minutes:30,protein:"pork",cuisine:"british",carb:"none",serves:4,adult:true,
 description:"A whole pork tenderloin — golden outside, blush-pink within — rested and sliced through a silky wholegrain mustard cream sauce with wilted spinach to cut through the richness. Elegant enough for a dinner party, simple enough for a Wednesday.",kidNote:"",
 ingredients:["2 pork tenderloins (about 400g each)","200ml double cream","2 tbsp wholegrain mustard","1 tbsp Dijon mustard","2 shallots","150ml chicken stock","2 tbsp vegetable oil","30g butter","200g spinach"],
 steps:["Preheat oven to 200°C / 180°C fan. Pat tenderloins completely dry and season all over. Heat oil in an oven-safe pan over high heat; sear on all sides until deeply golden all over, about 6 min total. Transfer to the oven and roast for 12–14 min until the centre is barely pink or an internal thermometer reads 63°C.","Transfer pork to a warm plate and rest uncovered for at least 8 min — the temperature continues to rise and the juices redistribute.","Finely slice the shallots. In the same pan over medium heat, melt butter and cook shallots for 3–4 min until soft. Add chicken stock and reduce by half, scraping up any browned bits.","Stir in both mustards and the cream. Simmer for 3–4 min, stirring, until the sauce coats the back of a spoon. Season well.","Wilt spinach in a separate pan with a splash of water for 1–2 min; season. Slice the pork into medallions and serve over spinach with the mustard cream poured over generously."],
 tip:"Pork tenderloin continues cooking after it leaves the oven — pull it at 63°C internal (or the moment the centre is barely pink) and the rest does the work; wait for it to look done before resting and it will be dry by the time it's sliced."},

{name:"Sausage, Squash & Taleggio Traybake",time:"55 min",minutes:55,protein:"pork",cuisine:"british",carb:"none",serves:4,adult:true,seasons:["autumn","winter"],
 description:"Burnished sausages and sweet, caramelised squash wedges roasted until they start to catch and go sticky, then blanketed with melting taleggio and wilted kale in the final minutes. Deeply comforting, entirely worth the wait — autumn on a tray.",kidNote:"Set aside a portion before adding the taleggio for children who prefer milder cheese; the squash and sausages are delicious on their own",
 ingredients:["8 good-quality pork sausages","1 small butternut squash","1 large red onion","100g kale","200g taleggio","3 tbsp olive oil","1 tsp chilli flakes","2 rosemary sprigs","1 lemon"],
 steps:["Preheat oven to 220°C / 200°C fan. Halve the squash, scoop out the seeds and cut into 2cm-thick wedges — no need to peel; the skin becomes deliciously chewy. Slice the red onion into thick wedges, keeping the root intact so the layers don't fall apart.","Spread squash and onion across a large roasting tin. Drizzle with 2 tbsp olive oil, scatter over the chilli flakes, pull the rosemary leaves from their sprigs and add those too. Season generously with salt and pepper. Nestle the sausages among the veg, toss to coat, and roast for 35 min, turning halfway, until the sausages are golden and the squash is tender and beginning to caramelise.","Meanwhile, pull the kale leaves from their stalks and tear into rough pieces. Toss with the remaining olive oil and a pinch of salt.","Scatter the kale over the tray. Tear the taleggio into rough chunks — it's a very soft, slightly sticky cheese, so don't worry about neatness — and distribute across the top.","Return to the oven for 8–10 min until the taleggio has melted into glossy, golden-edged puddles and the kale has crisped at its edges. Squeeze lemon over the tray and serve straight from it — the caramelised bits on the bottom are the best part."],
 tip:"Taleggio melts quickly and can go oily if overcooked — check at exactly 8 minutes and pull the tray the moment it's pooled into glossy puddles; another 2–3 minutes past perfect and the fat splits from the cheese."},

{name:"Smash Burgers with Special Sauce & Crispy Fries",time:"35 min",minutes:35,protein:"beef",cuisine:"american",seasons:["spring","summer"],carb:"bread",serves:4,
 description:"Thin, crispy-edged beef patties with a deeply caramelised, lacy crust, draped in molten cheese and piled into a toasted bun with a tangy special sauce. The burger technique that taught everyone what a screaming-hot pan and high-fat mince can do.",kidNote:"Children tend to love these — make smaller single-patty versions for younger ones and serve with plain ketchup rather than the special sauce",
 ingredients:["600g beef mince 20% fat","4 brioche burger buns","4 slices cheddar or American cheese","400g frozen oven fries","4 tbsp mayonnaise","2 tbsp ketchup","1 tbsp American mustard","1 tbsp white wine vinegar","1 little gem lettuce","2 tbsp vegetable oil"],
 steps:["Cook fries per pack instructions. Make the special sauce: combine mayo, ketchup, mustard and vinegar; stir until smooth. Taste — it should be tangy, creamy and slightly sweet. Adjust and set aside.","Divide the beef into 8 equal loosely packed balls (about 75g each) without compacting the mince tightly — loose balls smash better and create a better crust. Season the outside of each ball generously with salt and pepper.","Heat a cast iron or heavy frying pan over the highest heat possible until smoking. Add a small amount of oil. Place 2 mince balls in the pan with space between them and immediately press flat with a heavy spatula until very thin. Cook completely undisturbed for 90 seconds to 2 min until the edges look cooked and the underside is deeply, properly brown and lacy.","Lay a slice of cheese on each patty, flip, and cook for 30 more seconds. Total cooking time is about 2.5 min per batch. Cook remaining patties.","Toast the cut sides of the buns in the same pan for 30 seconds until golden. Build: special sauce on both halves, lettuce on the base, then 2 stacked patties. Serve immediately alongside the fries."],
 tip:"High-fat mince over screaming heat is non-negotiable — the fat renders on contact and creates the lacy, caramelised crust you cannot get from lean mince or a moderately hot pan; this is the only technique that works."},

{name:"Harissa Lamb Flatbreads with Cucumber Tzatziki",time:"30 min",minutes:30,protein:"lamb",cuisine:"middleeastern",carb:"bread",serves:4,adult:true,seasons:["spring","summer"],
 description:"Spiced, charred lamb mince heaped onto warm flatbreads with cooling cucumber tzatziki, fresh mint and a squeeze of lemon — the kind of dinner that turns an ordinary evening into something you'll talk about. Bold, fast, deeply satisfying.",kidNote:"Reduce the harissa to 1 tsp and taste before serving — serve children's portions with extra plain yoghurt alongside to cool the flavour",
 ingredients:["500g lamb mince","4 flatbreads or naan","2 tbsp harissa paste","1 tsp ground cumin","1 tsp ground coriander","300g Greek yoghurt","1 cucumber","2 garlic cloves","1 lemon","small bunch mint","2 tbsp olive oil"],
 steps:["Make the tzatziki first: grate the cucumber coarsely, then squeeze out every single drop of excess water with your hands or a clean cloth — watery tzatziki is the most common mistake. Combine with the yoghurt, crush in 1 garlic clove, add a squeeze of lemon and a generous pinch of salt. Stir well, taste, and refrigerate while you make everything else.","Combine lamb mince with harissa paste, cumin, coriander, the remaining crushed garlic, a generous pinch of salt and plenty of black pepper. Mix until uniformly rust-coloured throughout.","Heat the olive oil in a wide pan over high heat until shimmering and almost smoking. Add the lamb and press into a flat layer — leave completely untouched for 2–3 min so a proper char develops on the underside. Break up with a spoon and cook a further 3–4 min until the mince is cooked through with crispy, caramelised edges throughout.","Warm the flatbreads directly over a gas flame for 30 seconds per side until charred in patches and pliable — or in a dry pan over high heat. They should have real colour.","Spread a very generous layer of tzatziki over each flatbread. Pile on the spiced lamb, scatter with fresh mint leaves, squeeze lemon over generously, and drizzle with olive oil. Eat immediately."],
 tip:"Squeezing the grated cucumber completely dry is not optional — the excess water dilutes the yoghurt from a thick, creamy tzatziki into a thin, runny sauce that soaks through the flatbread rather than sitting on it."},

{name:"Creamy Butter Chicken with Pilau Rice",time:"40 min",minutes:40,protein:"chicken",cuisine:"indian",seasons:["autumn","winter"],carb:"rice",serves:4,
 description:"Tender pieces of golden chicken in a silky tomato and double cream sauce the colour of a sunset, fragrant with warm spices and finished with garam masala. Butter chicken is one of the great crowd-pleasers, and this version is simple enough for a weeknight without compromising a single thing.",kidNote:"Butter chicken is one of the best gateway curries for children — the sauce is mild, sweet and irresistibly creamy",
 ingredients:["4 chicken breasts","400g tin chopped tomatoes","150ml double cream","1 onion","3 garlic cloves","2 tbsp butter chicken paste","1 tbsp butter","1 tsp garam masala","250g basmati rice","1 tsp turmeric","2 tbsp vegetable oil"],
 steps:["Rinse the basmati rice under cold water until the water runs clear — this removes excess starch and keeps the grains separate. Add to a pan with 500ml cold water, turmeric and a generous pinch of salt. Bring to a boil, reduce to the lowest heat possible, cover tightly and cook for 12 min. Remove from heat and rest, lid still on, for 5 min. Do not lift the lid.","Dice chicken into 3cm chunks and season. Heat 1 tbsp oil in a wide pan over high heat. Brown chicken in batches without crowding — 3–4 min until golden on the outside but not cooked through. Remove and set aside.","Finely dice the onion. Add butter and remaining oil to the same pan over medium heat. Cook onion for 5–6 min until soft and translucent. Crush in the garlic and cook 1 min more.","Add the butter chicken paste and fry, stirring constantly, for 1–2 min until it deepens in colour and smells genuinely fragrant — this is the step that blooms the spices and gives the curry real depth.","Add chopped tomatoes, season well, and simmer 8 min until thickened. Return the chicken and pour in the cream. Simmer gently for 5–6 min until the chicken is cooked through. Stir in garam masala, taste and adjust seasoning generously. Serve over the pilau rice."],
 tip:"Browning the chicken separately before building the sauce creates a caramelised surface that enriches the finished dish — adding raw chicken directly to the sauce gives you pale, poached pieces with none of the depth."},

{name:"Pea, Pancetta & Lemon Risotto",time:"35 min",minutes:35,protein:"pork",cuisine:"italian",carb:"rice",serves:4,seasons:["spring","summer"],
 description:"Silky, slow-stirred risotto studded with crispy pancetta, bright sweet peas and a generous hit of lemon zest that lifts the whole thing into something genuinely memorable. This is the dish that rewards you for the 30 minutes you spend at the hob.",kidNote:"Omit the lemon zest for younger children and go easy on the parmesan — the creamy rice and sweet peas are naturally very appealing to them",
 ingredients:["350g arborio rice","150g pancetta or bacon lardons","200g frozen peas","1 onion","2 garlic cloves","1.2l hot chicken stock","150ml dry white wine","80g parmesan","30g butter","2 tbsp olive oil","2 lemons","small bunch parsley"],
 steps:["Heat the chicken stock in a separate saucepan and keep it at a bare simmer throughout — cold stock shocks the rice and makes the risotto gluey. Finely dice the onion. Heat olive oil in a wide, heavy-based pan over medium heat and fry the pancetta for 3–4 min until golden and crispy. Remove with a slotted spoon and set aside, leaving all the fat in the pan.","Add the onion to the pancetta fat and cook for 4–5 min until soft and translucent. Crush in the garlic and cook 1 min more. Add the rice and stir for 2 min until every grain is coated in fat and the edges turn slightly translucent — this toasting step is what prevents a stodgy result.","Pour in the wine and stir until fully absorbed. Then add the hot stock one ladleful at a time, stirring almost constantly and waiting for each ladleful to be fully absorbed before adding the next. This rhythm takes 18–20 min. You cannot rush it.","Add the frozen peas in the final 2 min of cooking. The risotto is ready when the rice is just tender with a tiny bite in the centre, and the whole thing moves in a slow, glossy wave when you shake the pan.","Remove from the heat. Beat in the butter and most of the parmesan — the risotto should look loose and flowing. Add the zest of both lemons and juice of one. Taste and season very generously. Serve topped with crispy pancetta, remaining parmesan and chopped parsley."],
 tip:"The risotto is ready when it flows like slow lava when you tilt the pan — if it holds a mound shape in the centre it's too tight; beat in another ladleful of hot stock before serving."},

{name:"Lemon & Herb Chicken Thigh Traybake with New Potatoes",time:"45 min",minutes:45,protein:"chicken",cuisine:"british",seasons:["spring","summer"],carb:"potato",serves:4,
 description:"Bone-in chicken thighs roasted until the skin is shatteringly crisp and the fat has basted the potatoes below, with cherry tomatoes that burst into a sauce and a bright lemon-herb finish. One tray, almost no effort, genuinely impressive.",kidNote:"The potatoes soak up all the chicken juices and are usually the first thing children eat — roast a few extra to account for this",
 ingredients:["6 bone-in chicken thighs","500g new potatoes","200g cherry tomatoes","1 lemon","4 garlic cloves","1 tbsp fresh or dried rosemary","2 tbsp olive oil","1 tsp smoked paprika","handful fresh parsley"],
 steps:["Preheat oven to 220°C / 200°C fan. Halve new potatoes and spread in a large roasting tin. Crush the garlic cloves (no need to peel) and add to the tin with rosemary, half the paprika, salt and pepper. Drizzle with 1 tbsp olive oil and toss to coat.","Pat the chicken thighs completely dry with kitchen paper — dry skin is the essential first step to crispness; moisture is its enemy. Rub all over with the remaining olive oil, paprika, salt and pepper.","Nestle the chicken thighs skin-side up among the potatoes, with space between each one so the heat can circulate. Cut the lemon in half and tuck both halves into the tin.","Roast for 25 min. Add the cherry tomatoes, tuck them around the chicken and return for a further 15–20 min until the chicken skin is deeply golden and crisp, and the tomatoes have burst and collapsed.","Check the chicken is cooked by piercing the thickest part of a thigh — the juices must run completely clear with no trace of pink. Squeeze the roasted lemon halves over everything, scatter with parsley, and serve straight from the tray."],
 tip:"A very hot oven (220°C) is what crisps the skin in the first 25 minutes before the tomatoes go in — once they're added, the moisture they release means the oven temperature drops naturally and everything finishes gently."}
];

/* ── Utilities ────────────────────────────────────────────────────────────── */
function getSeason(){var m=new Date().getMonth();if(m>=2&&m<=4)return'spring';if(m>=5&&m<=7)return'summer';if(m>=8&&m<=10)return'autumn';return'winter';}

function smartPick(pool,count,opts){
  if(count<=0)return[];
  var history=opts.history||[],favs=opts.favourites||[],dis=opts.dislikes||[];
  var season=getSeason(),now=Date.now(),WEEK=7*24*60*60*1000;
  var avail=pool.filter(function(m){return!dis.includes(m.name)});
  if(avail.length<count)avail=pool;
  var scored=avail.map(function(m){
    var s=1,uses=history.filter(function(h){return h.name===m.name});
    if(uses.length){var wa=(now-Math.max.apply(null,uses.map(function(h){return h.date})))/WEEK;if(wa<1.5)s*=0.02;else if(wa<3)s*=0.2;else if(wa<5)s*=0.55;}
    if(favs.includes(m.name))s*=2.5;
    if(m.seasons&&m.seasons.includes(season))s*=1.4;
    return{m:m,s:s};
  });
  var selected=[],usedP={},usedC={},usedCarb={};
  for(var i=0;i<count;i++){
    var remaining=scored.filter(function(x){return!selected.some(function(s){return s.name===x.m.name})});
    if(!remaining.length)break;
    var adj=remaining.map(function(x){
      var w=Math.max(x.s,0.001),pc=usedP[x.m.protein]||0,cc=usedC[x.m.cuisine]||0,cb=usedCarb[x.m.carb]||0;
      if(pc>=2)w*=0.08;else if(pc===1)w*=0.5;
      if(cc>=2)w*=0.12;else if(cc===1)w*=0.6;
      if(x.m.carb&&x.m.carb!=='none'){if(cb>=2)w*=0.12;else if(cb===1)w*=0.6;}
      return{m:x.m,w:Math.max(w,0.001)};
    });
    var total=adj.reduce(function(a,x){return a+x.w},0),rand=Math.random()*total,chosen=adj[adj.length-1].m;
    for(var j=0;j<adj.length;j++){rand-=adj[j].w;if(rand<=0){chosen=adj[j].m;break;}}
    selected.push(chosen);usedP[chosen.protein]=(usedP[chosen.protein]||0)+1;usedC[chosen.cuisine]=(usedC[chosen.cuisine]||0)+1;
    if(chosen.carb&&chosen.carb!=='none')usedCarb[chosen.carb]=(usedCarb[chosen.carb]||0)+1;
  }
  return selected;
}

function scaledIngredients(ingredients,scale){
  return(ingredients||[]).map(function(str){
    var m=str.match(/^(\d+(?:\.\d+)?)\s*(g|kg|ml|l|tbsp|tsp|x|)\b\s*(.+)$/i);
    if(!m)return{qty:'',label:str,display:str};
    var num=parseFloat(m[1])*scale,rounded=num%1<0.1||num%1>0.9?Math.round(num):parseFloat(num.toFixed(1));
    var u=(m[2]||'').toLowerCase(),label=m[3].trim();
    var sp=['g','kg','ml','l'].includes(u)?'':' ';
    var display=u?(rounded+sp+u+' '+label):(rounded+' '+label);
    return{qty:rounded+(u?sp+u:''),label:label,display:display};
  });
}

function categoriseItem(label){
  var s=label.toLowerCase();
  if(/\bchicken\b|breast|thigh|drumstick|goujon|beef mince|turkey mince|\bpork\b|sausage|\blamb\b|salmon|\bfish\b|prawn|\btuna\b|meatball|bacon|\bham\b/.test(s))return'Meat & Fish';
  if(/\bcheese\b|\bmilk\b|\bbutter\b|cream|egg|yoghurt|crème fraîche|mozzarella|parmesan/.test(s))return'Dairy & Eggs';
  if(/frozen/.test(s))return'Frozen';
  if(/\btin\b|passata|baked bean|stock|coconut milk|chopped tomato|soy sauce|teriyaki|sweet chilli|ketchup|mayo|mayonnaise|mustard|paste|olive oil|vegetable oil|sesame oil|honey|plain flour|mixed herb|oregano|paprika|cumin|coriander|garlic granule|fajita|taco season/.test(s))return'Tins & Pantry';
  if(/pasta|penne|spaghetti|fusilli|rigatoni|orzo|macaroni|noodle|\brice\b/.test(s))return'Pasta, Rice & Grains';
  if(/bread|tortilla|pitta|naan|pizza base|taco shell|\bwrap\b/.test(s))return'Bread & Wraps';
  return'Fresh Produce';
}

function buildShop(plan,pantry,familySize){
  var pw=(pantry||'').toLowerCase().split(/[,\n]/).map(function(s){return s.trim()}).filter(Boolean);
  var seen=new Map();
  plan.meals.forEach(function(m){
    var scale=familySize/(m.serves||4);
    scaledIngredients(m.ingredients,scale).forEach(function(ing){
      var lc=ing.label.toLowerCase();
      if(pw.some(function(w){var re=new RegExp('(?:^|\\b)'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:\\b|$)','i');return re.test(lc)||re.test(ing.display.toLowerCase());}))return;
      if(seen.has(lc)){
        var ex=seen.get(lc);
        var em=ex.qty.match(/^([\d.]+)\s*(g|kg|ml|l|tbsp|tsp|x|)$/i);
        var nm=ing.qty.match(/^([\d.]+)\s*(g|kg|ml|l|tbsp|tsp|x|)$/i);
        if(em&&nm&&em[2].toLowerCase()===nm[2].toLowerCase()){
          var tot=parseFloat(em[1])+parseFloat(nm[1]);
          var rounded=tot%1<0.1||tot%1>0.9?Math.round(tot):parseFloat(tot.toFixed(1));
          var u=em[2].toLowerCase(),sp=['g','kg','ml','l'].includes(u)?'':' ';
          seen.set(lc,{qty:rounded+(u?sp+u:''),label:ing.label,display:u?(rounded+sp+u+' '+ing.label):(rounded+' '+ing.label),category:categoriseItem(lc)});
        }
        return;
      }
      seen.set(lc,{qty:ing.qty,label:ing.label,display:ing.display,category:categoriseItem(lc)});
    });
  });
  var result={};CATEGORY_ORDER.forEach(function(c){result[c]=[]});
  seen.forEach(function(item){(result[item.category]||(result['Fresh Produce'])).push(item)});
  var out={};CATEGORY_ORDER.forEach(function(c){if(result[c]&&result[c].length)out[c]=result[c]});
  return out;
}

function countPantryExclusions(plan,pantry,familySize){
  var pw=(pantry||'').toLowerCase().split(/[,\n]/).map(function(s){return s.trim()}).filter(Boolean);
  if(!pw.length)return 0;
  var excluded=new Set();
  plan.meals.forEach(function(m){
    var scale=familySize/(m.serves||4);
    scaledIngredients(m.ingredients,scale).forEach(function(ing){
      var lc=ing.label.toLowerCase();
      if(pw.some(function(w){var re=new RegExp('(?:^|\\b)'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:\\b|$)','i');return re.test(lc)||re.test(ing.display.toLowerCase());}))excluded.add(lc);
    });
  });
  return excluded.size;
}
function formatAgo(ts){
  if(!ts)return'';
  var days=Math.floor((Date.now()-ts)/(24*60*60*1000));
  if(days===0)return'Generated today';
  if(days===1)return'Generated yesterday';
  return'Generated '+days+' days ago';
}
function getPool(type,timeFilter,customMeals,kids){
  if(kids===undefined)kids=true;
  var base=type==='weekend'?WEEKEND_MEALS:WEEKDAY_MEALS;
  var custom=(customMeals||[]).filter(function(m){return type==='weekday'?m.pool!=='weekend':m.pool!=='weekday'});
  var limit=timeFilter==='15'?15:timeFilter==='25'?25:Infinity;
  return[].concat(base,custom).filter(function(m){return m.minutes<=limit&&(!m.adult||!kids)});
}

function nextDateForDayName(dayName){
  var idx=DAYS.indexOf(dayName),today=new Date(),todayDow=(today.getDay()+6)%7,diff=(idx-todayDow+7)%7;
  var d=new Date(today);d.setDate(today.getDate()+diff);return d;
}
function toICSDate(d){return''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function generateICS(plan, familySize) {
  familySize = familySize || 4;
  var uid = Date.now();
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Family Meal Planner//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  plan.meals.forEach(function(meal, i) {
    var d = nextDateForDayName(meal.day), ds = toICSDate(d), nd = new Date(d);
    nd.setDate(d.getDate()+1);
    var desc = [];
    if(meal.description) desc.push(meal.description);
    var scale = familySize / (meal.serves||4);
    var ing = scaledIngredients(meal.ingredients||[], scale);
    if(ing.length){ desc.push(''); desc.push('INGREDIENTS (serves '+familySize+'):'); ing.forEach(function(x){desc.push('• '+x.display);}); }
    if(meal.steps&&meal.steps.length){ desc.push(''); desc.push('RECIPE:'); meal.steps.forEach(function(s,n){desc.push((n+1)+'. '+s);}); }
    if(meal.tip){ desc.push(''); desc.push("CHEF'S TIP: "+meal.tip); }
    var raw = desc.join('\n').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
    var prop = 'DESCRIPTION:'+raw, folded = '';
    while(prop.length>75){ folded+=prop.slice(0,75)+'\r\n '; prop=prop.slice(75); }
    folded+=prop;
    lines.push('BEGIN:VEVENT','UID:meal-'+uid+'-'+i+'@mealplanner','SUMMARY:Dinner: '+meal.name,
      'DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+toICSDate(nd),folded,'END:VEVENT');
  });
  lines.push('END:VCALENDAR'); return lines.join('\r\n');
}
function downloadICS(plan, familySize){
  var content=generateICS(plan,familySize),blob=new Blob([content],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='meal-plan.ics';document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

function encodePlan(plan,dayConfig,familySize,customMeals){
  var usedCustom=plan.meals.filter(function(m){return m.custom});
  var payload={v:1,d:dayConfig,f:familySize,m:plan.meals.map(function(m){return{n:m.name,dy:m.day}}),cm:usedCustom.length?usedCustom:undefined};
  try{return btoa(unescape(encodeURIComponent(JSON.stringify(payload))))}catch(e){return btoa(JSON.stringify(payload))}
}
function decodePlan(encoded,allBuiltin){
  try{
    var payload=JSON.parse(decodeURIComponent(escape(atob(encoded))));
    if(!payload||!payload.m)return null;
    var all=[].concat(allBuiltin,payload.cm||[]);
    var meals=payload.m.map(function(x){
      var found=all.find(function(m){return m.name===x.n});
      return found?Object.assign({},found,{day:x.dy}):{name:x.n,day:x.dy,description:'Shared meal',ingredients:[],steps:[],time:'',minutes:0,protein:'',cuisine:'',serves:4};
    });
    return{meals:meals,dayConfig:payload.d||DEFAULT_DAY_CFG,familySize:payload.f||4};
  }catch(e){return null;}
}
</script>

<script type="text/babel">

  if(days===1)return'yesterday';
  if(days<7)return days+'d ago';

          {["chicken","beef","fish","pork","lamb","seafood","eggs","veggie"].map(p=><option key={p}>{p}</option>)}
        </select>)}
        {row("Cuisine", <select value={f.cuisine} onChange={e=>set('cuisine',e.target.value)} style={ss}>
          {["british","italian","asian","mexican","indian","american","middleeastern","other"].map(c=><option key={c}>{c}</option>)}
        </select>)}
        {row("Carb base", <select value={f.carb} onChange={e=>set('carb',e.target.value)} style={ss}>
          {["none","pasta","rice","potato","bread","noodles"].map(c=><option key={c}>{c}</option>)}
        </select>)}
      </div>
      {row("For", <select value={f.pool} onChange={e=>set('pool',e.target.value)} style={ss}>
        <option value="weekday">Weekday evenings</option>
        <option value="weekend">Weekend meals</option>
        <option value="both">Either</option>
      </select>)}
      {row("Ingredients (one per line)", <textarea value={f.ingredients} onChange={e=>set('ingredients',e.target.value)} placeholder={"400g pasta\n2 chicken breasts\n1 tin tomatoes"} style={ts} />)}
      {row("Recipe steps (one per line)", <textarea value={f.steps} onChange={e=>set('steps',e.target.value)} placeholder={"Cook the pasta.\nFry the chicken until golden.\nAdd the sauce and simmer."} style={{ ...ts, minHeight:"100px" }} />)}
      <Primary disabled={!valid} onClick={handleSave}>Save meal</Primary>
      <Secondary muted onClick={onCancel}>Cancel</Secondary>
    </div>
  );
}

function App() {
  const [step,        setStep]       = useState("setup");
  const [dayConfig,   setDayConfig]  = useState(()=>load(SK.DAYS_CFG, DEFAULT_DAY_CFG));
  const [familySize,  setFamilySize] = useState(()=>load(SK.FAMILY, 4));
  const [timeFilter,  setTimeFilter] = useState(()=>load(SK.FILTER, "any"));
  const [pantry,      setPantry]     = useState(()=>load(SK.PANTRY, ""));
  const [plan,        setPlan]       = useState(null);
  const [shopList,    setShopList]   = useState(null);
  const [checked,     setChecked]    = useState(()=>load(SK.CHECKED, {}));
  const [mealHistory, setMealHistory]= useState(()=>load(SK.HISTORY, []));
  const [favourites,  setFavourites] = useState(()=>load(SK.FAVS, []));
  const [dislikes,    setDislikes]   = useState(()=>load(SK.DISLIKES, []));
  const [customMeals, setCustomMeals]= useState(()=>load(SK.CUSTOM, []));
  const [savedState,  setSavedState] = useState(()=>load(SK.STATE, null));
  const [toast,       setToast]      = useState(null);
  const [showPrefs,   setShowPrefs]  = useState(false);
  const [showHelp,    setShowHelp]   = useState(false);
  const [expandedDay, setExpandedDay]= useState(null);
  const [sharedPlan,  setSharedPlan] = useState(null);
  const [kidsConfig, setKidsConfig] = useState(()=>load(SK.KIDS_CFG, {}));
  const [cookNow,      setCookNow]      = useState(null);
  const [cookNowExp,   setCookNowExp]   = useState(false);
  const [pickerFor,    setPickerFor]    = useState(null);
  const [invalidShare, setInvalidShare] = useState(false);
  const [pendingDislike, setPendingDislike] = useState(null);
  const [addToPlanOpen,  setAddToPlanOpen]  = useState(false);
  const dislikeTimerRef = useRef(null);

  useEffect(()=>{
    const hash = window.location.hash;
    if(hash.startsWith('#share=')){
      const decoded = decodePlan(hash.slice(7), [...WEEKDAY_MEALS,...WEEKEND_MEALS,...customMeals]);
      if(decoded){ setSharedPlan(decoded); setStep("shared"); }
      else { setInvalidShare(true); window.history.replaceState(null,'',location.pathname); }
    }
  }, []);

  useEffect(()=>{ save(SK.DAYS_CFG, dayConfig); }, [dayConfig]);
  useEffect(()=>{ save(SK.FAMILY, familySize); }, [familySize]);
  useEffect(()=>{ save(SK.FILTER, timeFilter); }, [timeFilter]);
  useEffect(()=>{ save(SK.KIDS_CFG, kidsConfig); }, [kidsConfig]);
  useEffect(()=>{
    document.body.style.overflow = (cookNow||pickerFor) ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [cookNow, pickerFor]);
  useEffect(()=>{ if(!cookNow) setAddToPlanOpen(false); }, [cookNow]);
  useEffect(()=>{ save(SK.CHECKED, checked); }, [checked]);
  const _familySizeInit = useRef(false);
  useEffect(()=>{
    if(!_familySizeInit.current){ _familySizeInit.current=true; return; }
    if(plan){
      const newShop=buildShop(plan,pantry,familySize);
      setShopList(newShop);
      const ns={...savedState,familySize,shopList:newShop};
      setSavedState(ns); save(SK.STATE,ns);
    }
  }, [familySize]);

  const scrollTop = () => setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}), 50);
  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null), 2600); };

  const season = getSeason();
  const si = SEASON_INFO[season];
  const homeDays  = DAYS.filter(d=>dayConfig[d]==="home");
  const goustoDays = DAYS.filter(d=>dayConfig[d]==="gousto");
  const pantryExcluded = plan&&pantry.trim() ? countPantryExclusions(plan,pantry,familySize) : 0;

  const getKids = day => kidsConfig[day] !== false;
  const toggleKids = day => setKidsConfig(prev=>({...prev,[day]:!getKids(day)}));

  const generate = () => {
    const opts = { history:mealHistory, favourites, dislikes };
    const selected = [];
    const meals = homeDays.map(day => {
      const type = WEEKEND.includes(day) ? "weekend" : "weekday";
      const pool = getPool(type, timeFilter, customMeals, getKids(day));
      const usedNames = selected.map(m=>m.name);
      const avail = pool.filter(m=>!usedNames.includes(m.name));
      const [pick] = smartPick(avail.length ? avail : pool, 1, opts);
      if(pick){ selected.push(pick); return {...pick, day}; }
      return null;
    }).filter(Boolean);
    const newPlan = { meals, generatedAt: Date.now() };
    const newShop = buildShop(newPlan, pantry, familySize);
    const now = Date.now();
    const newHistory = [...mealHistory, ...meals.map(m=>({name:m.name,date:now}))].filter(h=>now-h.date<60*24*60*60*1000);
    setMealHistory(newHistory); save(SK.HISTORY, newHistory); save(SK.PANTRY, pantry);
    setPlan(newPlan); setShopList(newShop); setChecked({}); setExpandedDay(null); setStep("plan");
    const ns={dayConfig,familySize,timeFilter,plan:newPlan,shopList:newShop};
    setSavedState(ns); save(SK.STATE, ns); scrollTop();
  };

  const swap = (day, extraDislikes=[]) => {
    const pool = getPool(WEEKEND.includes(day)?"weekend":"weekday", timeFilter, customMeals, getKids(day));
    const used = plan.meals.map(m=>m.name);
    const allD = [...dislikes, ...extraDislikes];
    const avail = pool.filter(m=>!used.includes(m.name)&&!allD.includes(m.name));
    if(!avail.length){ showToast("No more meals to swap to!"); return; }
    const r = avail[Math.floor(Math.random()*avail.length)];
    const newPlan = { meals:plan.meals.map(m=>m.day===day?{...r,day}:m) };
    const newShop = buildShop(newPlan, pantry, familySize);
    setPlan(newPlan); setShopList(newShop);
    const ns={...savedState,plan:newPlan,shopList:newShop};
    setSavedState(ns); save(SK.STATE, ns);
    showToast("Swapped to "+r.name);
  };

  const toggleFav = name => {
    const isFav = favourites.includes(name);
    const nf = isFav?favourites.filter(f=>f!==name):[...favourites,name];
    setFavourites(nf); save(SK.FAVS, nf);
    showToast(isFav?"Removed from favourites":"Added to favourites ⭐");
  };
  const commitDislike = name => {
    setDislikes(prev=>{const nd=prev.includes(name)?prev:[...prev,name];save(SK.DISLIKES,nd);return nd;});
    setPendingDislike(null);
  };
  const undoDislike = () => { clearTimeout(dislikeTimerRef.current); setPendingDislike(null); showToast("Restored ✓"); };
  const addDislike = name => {
    clearTimeout(dislikeTimerRef.current);
    setPendingDislike(name);
    dislikeTimerRef.current = setTimeout(()=>commitDislike(name), 4000);
    const mealDay = plan?.meals.find(m=>m.name===name)?.day;
    if(mealDay) swap(mealDay,[name]);
  };
  const removeDislike = name => {
    const nd=dislikes.filter(d=>d!==name); setDislikes(nd); save(SK.DISLIKES, nd);
    showToast("Restored ✓");
  };
  const pickCookNow = () => {
    const allDis = pendingDislike ? [...dislikes, pendingDislike] : dislikes;
    const all=[...getPool("weekday","any",customMeals,true),...getPool("weekend","any",customMeals,true)];
    const unique=all.filter((m,i)=>all.findIndex(x=>x.name===m.name)===i);
    const [pick]=smartPick(unique,1,{history:mealHistory,favourites,dislikes:allDis});
    setCookNow(pick||null); setCookNowExp(true);
  };
  const allMeals = [...WEEKDAY_MEALS,...WEEKEND_MEALS,...customMeals].filter((m,i,a)=>a.findIndex(x=>x.name===m.name)===i);
  const handlePickerSelect = (meal) => {
    if(pickerFor==='cookNow'){ setCookNow(meal); setCookNowExp(true); }
    else if(pickerFor){
      const day=pickerFor;
      const newPlan={meals:plan.meals.map(m=>m.day===day?{...meal,day}:m)};
      const newShop=buildShop(newPlan,pantry,familySize);
      setPlan(newPlan); setShopList(newShop);
      const ns={...savedState,plan:newPlan,shopList:newShop};
      setSavedState(ns); save(SK.STATE,ns);
      showToast("Changed to "+meal.name);
    }
    setPickerFor(null);
  };
  const addToPlan = (day, meal) => {
    if(!plan) return;
    const newPlan={...plan,meals:plan.meals.map(m=>m.day===day?{...meal,day}:m)};
    const newShop=buildShop(newPlan,pantry,familySize);
    setPlan(newPlan); setShopList(newShop);
    const ns={...savedState,plan:newPlan,shopList:newShop};
    setSavedState(ns); save(SK.STATE,ns);
    showToast("Added to "+day+" ✓");
    setCookNow(null);
  };
  const addCustom = meal => { const nc=[...customMeals,meal]; setCustomMeals(nc); save(SK.CUSTOM,nc); };
  const deleteCustom = name => { const nc=customMeals.filter(m=>m.name!==name); setCustomMeals(nc); save(SK.CUSTOM,nc); showToast("Meal removed"); };

  const restoreSaved = () => {
    if(!savedState)return;
    if(savedState.dayConfig) setDayConfig(savedState.dayConfig);

    if(savedState.timeFilter) setTimeFilter(savedState.timeFilter);
    setPlan(savedState.plan);
    setShopList(savedState.shopList||buildShop(savedState.plan,pantry,savedState.familySize||4));
    setChecked({}); setExpandedDay(null); setStep("plan"); scrollTop();
  };

  const reset = () => {
    setSavedState(null); save(SK.STATE,null);
    setPlan(null); setShopList(null); setChecked({}); setExpandedDay(null);
    setStep("setup"); scrollTop();
  };
  const confirmReset = () => { if(window.confirm('Start over and discard this week\'s plan?')) reset(); };

  const doShare = () => {
    const encoded = encodePlan(plan,dayConfig,familySize,customMeals);

    setFamilySize(sharedPlan.familySize||4);
    setPlan(sharedPlan);

  if(showHelp) return (

          <div style={{ fontSize:"14px", opacity:0.85, marginTop:"6px" }}>Serves {sharedPlan.familySize} · {sharedPlan.meals.length} meals planned</div>

            <textarea style={{ width:"100%", padding:"14px 16px", border:`2px solid ${P.border}`, borderRadius:"14px",

        {step==="plan" && plan && (

            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"22px", lineHeight:1.3, marginBottom:"4px" }}>Here's the plan</div>

            <p style={{ fontSize:"13px", color:P.muted, marginBottom:"16px" }}>Tap a card for recipe &amp; ingredients · ☆ favourite · 🔄 swap · 👎 skip forever</p>
            {DAYS.map(day=>{
              if(dayConfig[day]==="off") return null;

                <div key={day} style={{ background:P.card, borderRadius:"16px", padding:"16px 18px", marginBottom:"10px",

                  <div style={{ fontSize:"26px" }}>📦</div>
                  <div>
                    <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"12px", color:P.accent, textTransform:"uppercase", marginBottom:"3px" }}>{day}</div>
                    <div style={{ fontWeight:700, fontSize:"16px", marginBottom:"2px" }}>Gousto</div>
                    <div style={{ fontSize:"13px", color:P.muted }}>Meal kit — sorted!</div>
                  </div>

              const meal=plan.meals.find(m=>m.day===day);
              if(!meal)return null;

              const lastUsed=lu.length?Math.max(...lu.map(h=>h.date)):null;
              return <MealCard key={day} meal={meal} day={day}

                onDislike={()=>addDislike(meal.name)} onChoose={()=>setPickerFor(day)} readOnly={false}
                lastUsed={lastUsed} />;

            {(()=>{

              const parts=[...Object.entries(pc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>v+'× '+k),...Object.entries(cb).sort((a,b)=>b[1]-a[1]).map(([k,v])=>v+'× '+k)];

                          {checked[key]?"✓":""}
                        </div>
                        <div style={{ fontSize:"14px", textDecoration:checked[key]?"line-through":"none",

              </div>
              <div style={{ padding:"16px" }}>
                {(()=>{const clu=mealHistory.filter(h=>h.name===cookNow.name);const cookNowLastUsed=clu.length?Math.max(...clu.map(h=>h.date)):null;return(
                <MealCard meal={cookNow} day="Tonight" isFav={favourites.includes(cookNow.name)}
                  isSeasonal={!!(cookNow.seasons&&cookNow.seasons.includes(season))}
                  seasonLabel={si.label} expanded={cookNowExp} familySize={familySize}
                  onExpand={()=>setCookNowExp(x=>!x)}
                  onFav={()=>toggleFav(cookNow.name)} onSwap={pickCookNow}
                  onDislike={()=>{addDislike(cookNow.name);pickCookNow();}} readOnly={false}
                  lastUsed={cookNowLastUsed} />
                );})()}
              </div>
              <div style={{ padding:"0 16px 20px",borderRadius:"0 0 20px 20px" }}>
                <button onClick={pickCookNow}
                  style={{ width:"100%",background:`linear-gradient(135deg,${P.accent},${P.accentDark})`,
                    color:"#fff",border:"none",borderRadius:"14px",
                    padding:"15px 24px",fontSize:"15px",fontWeight:700,
                    cursor:"pointer",boxShadow:P.shadow }}>
                  🔀 Suggest something else
                </button>
                <button onClick={()=>setPickerFor('cookNow')}
                  style={{ width:"100%",background:"none",border:"none",
                    color:P.muted,fontSize:"14px",fontWeight:600,
                    cursor:"pointer",marginTop:"12px",padding:"4px" }}>
                  📋 Browse all meals
                </button>
                {plan && homeDays.length>0 && (<>
                  <button onClick={()=>setAddToPlanOpen(x=>!x)}
                    style={{ width:"100%",background:"none",border:"none",
                      color:P.muted,fontSize:"14px",fontWeight:600,
                      cursor:"pointer",marginTop:"12px",padding:"4px" }}>
                    📅 Add to this week's plan
                  </button>
                  {addToPlanOpen && (
                    <div style={{ marginTop:"12px",background:P.card,borderRadius:"14px",
                      padding:"10px 14px",border:`1px solid ${P.border}` }}>
                      <div style={{ fontSize:"11px",color:P.muted,fontWeight:700,
                        textTransform:"uppercase",letterSpacing:"1px",marginBottom:"8px" }}>Replace which day?</div>
                      {homeDays.map((day,idx)=>{
                        const existing=plan.meals.find(m=>m.day===day);
                        return (
                          <div key={day} onClick={()=>addToPlan(day,cookNow)}
                            style={{ display:"flex",justifyContent:"space-between",alignItems:"center",
                              padding:"9px 4px",cursor:"pointer",
                              borderBottom:idx<homeDays.length-1?`1px solid ${P.border}`:"none" }}>
                            <div style={{ fontWeight:700,fontSize:"13px",minWidth:"72px" }}>{day}</div>
                            <div style={{ fontSize:"12px",color:P.muted,textAlign:"right",flex:1,
                              overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap" }}>
                              {existing?existing.name:'—'}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </>)}
              </div>
            </div>
          </div>
          </div>
        </div>
      )}
      {pickerFor && <MealPickerSheet meals={allMeals} onPick={handlePickerSelect} onClose={()=>setPickerFor(null)} />}
      {/* Floating Cook Tonight button */}
      <button onClick={pickCookNow} aria-label="Get a recipe suggestion for tonight"
        style={{ position:"fixed",bottom:"24px",right:"20px",zIndex:200,
          background:`linear-gradient(135deg,${P.accent},${P.accentDark})`,
          color:"#fff",border:"none",borderRadius:"28px",
          padding:"14px 20px",fontSize:"15px",fontWeight:700,
          cursor:"pointer",boxShadow:"0 4px 20px rgba(224,122,95,0.45)",
          display:"flex",alignItems:"center",gap:"8px",whiteSpace:"nowrap" }}>
        🍴 Cook tonight
      </button>
      {toast&&<div className="toast">{toast}</div>}
      {pendingDislike && (
        <div style={{ position:"fixed",bottom:"28px",left:"50%",transform:"translateX(-50%)",
          background:"#2D3436",color:"#fff",padding:"12px 16px 12px 20px",borderRadius:"12px",
          fontSize:"14px",fontWeight:600,zIndex:9999,animation:"slideUp 0.25s ease",
          boxShadow:"0 4px 20px rgba(0,0,0,0.25)",display:"flex",alignItems:"center",
          gap:"12px",whiteSpace:"nowrap" }}>
          <span>Won't suggest again</span>
          <button onClick={undoDislike} style={{ background:"rgba(255,255,255,0.2)",border:"none",
            color:"#fff",padding:"5px 10px",borderRadius:"8px",fontSize:"13px",fontWeight:700,
            cursor:"pointer" }}>Undo</button>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
