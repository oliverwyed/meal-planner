            <div><div style={{ fontWeight:700, fontSize:"15px" }}>{m.name}</div>
            <div style={{ fontSize:"12px", color:P.muted }}>{m.time} · {m.pool} · {m.protein}</div></div>
            <button onClick={()=>{if(window.confirm('Remove "'+m.name+'"?'))onDeleteCustom(m.name);}}
              style={{ background:"none", border:"none", color:P.muted, cursor:"pointer", fontSize:"20px" }}>✕</button>
          </div>
        ))}
        <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"18px", marginBottom:"10px", marginTop:"32px" }}>⭐ Favourites ({allFavs.length})</div>
        {allFavs.length===0
          ? <p style={{ color:P.muted, fontSize:"14px", marginBottom:"8px" }}>Tap ☆ on any meal to add it as a favourite — it'll be suggested more often.</p>
          : allFavs.map(m=>(
            <div key={m.name} style={{ background:P.card, borderRadius:"12px", padding:"12px 16px", marginBottom:"8px",
              boxShadow:P.shadow, border:`1px solid ${P.border}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div><div style={{ fontWeight:700, fontSize:"15px" }}>{m.name}</div>
              <div style={{ fontSize:"12px", color:P.muted }}>{m.time} · {m.cuisine}</div></div>
              <button onClick={()=>onToggleFav(m.name)} style={{ background:"none", border:"none", fontSize:"22px", cursor:"pointer", color:P.gold }}>★</button>
            </div>
          ))}
        <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"18px", marginBottom:"10px", marginTop:"32px" }}>👎 Skipped ({allDislikes.length})</div>
        {allDislikes.length===0
          ? <p style={{ color:P.muted, fontSize:"14px" }}>Tap 👎 on a meal to stop it being suggested. You can restore it here.</p>
          : allDislikes.map(m=>(
            <div key={m.name} style={{ background:P.card, borderRadius:"12px", padding:"12px 16px", marginBottom:"8px",
              boxShadow:P.shadow, border:`1px solid ${P.border}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div><div style={{ fontWeight:700, fontSize:"15px" }}>{m.name}</div>
              <div style={{ fontSize:"12px", color:P.muted }}>{m.time} · {m.cuisine}</div></div>
              <button onClick={()=>onRemoveDislike(m.name)} style={{ background:"none", border:`2px solid ${P.accent}`,
                color:P.accent, borderRadius:"8px", padding:"6px 12px", fontSize:"13px", cursor:"pointer", fontWeight:700 }}>Restore</button>
            </div>
          ))}
        <div style={{ marginTop:"36px", background:P.card, borderRadius:"12px", padding:"16px",
          border:`1px solid ${P.border}`, fontSize:"13px", color:P.muted, lineHeight:1.6 }}>
          <strong style={{ color:P.text }}>How smart suggestions work</strong><br/>
          Meals used in the last 2 weeks are heavily de-prioritised. Favourites appear 2.5× more often.
          Seasonal meals get a boost. Protein types and cuisines are balanced across the week automatically.
        </div>
        {(allFavs.length>0||allDislikes.length>0)&&(
          <button onClick={()=>{if(window.confirm('Clear all favourites and skipped meals?'))onClearAll();}}
            style={{ marginTop:"32px", color:P.muted, background:"none", border:"none", fontSize:"14px", cursor:"pointer", width:"100%", textAlign:"center" }}>
            Clear all preferences
          </button>
        )}
      </div>
    </div>
  );
}

function App() {
  const [step,        setStep]       = useState("setup");
  const [dayConfig,   setDayConfig]  = useState(()=>load(SK.DAYS_CFG, DEFAULT_DAY_CFG));
  const [familySize,  setFamilySize] = useState(()=>load(SK.FAMILY, 4));
  const [timeFilter,  setTimeFilter] = useState(()=>load(SK.FILTER, "any"));
  const [pantry,      setPantry]     = useState(()=>load(SK.PANTRY, ""));
  const [plan,        setPlan]       = useState(null);
  const [shopList,    setShopList]   = useState(null);
  const [checked,     setChecked]    = useState({});
  const [mealHistory, setMealHistory]= useState(()=>load(SK.HISTORY, []));
  const [favourites,  setFavourites] = useState(()=>load(SK.FAVS, []));
  const [dislikes,    setDislikes]   = useState(()=>load(SK.DISLIKES, []));
  const [customMeals, setCustomMeals]= useState(()=>load(SK.CUSTOM, []));
  const [savedState,  setSavedState] = useState(()=>load(SK.STATE, null));
  const [toast,       setToast]      = useState(null);
  const [showPrefs,   setShowPrefs]  = useState(false);
  const [expandedDay, setExpandedDay]= useState(null);
  const [sharedPlan,  setSharedPlan] = useState(null);

  useEffect(()=>{
    const hash = window.location.hash;
    if(hash.startsWith('#share=')){
      const decoded = decodePlan(hash.slice(7), [...WEEKDAY_MEALS,...WEEKEND_MEALS,...customMeals]);
      if(decoded){ setSharedPlan(decoded); setStep("shared"); }
    }
  }, []);

  useEffect(()=>{ save(SK.DAYS_CFG, dayConfig); }, [dayConfig]);
  useEffect(()=>{ save(SK.FAMILY, familySize); }, [familySize]);
  useEffect(()=>{ save(SK.FILTER, timeFilter); }, [timeFilter]);

  const scrollTop = () => setTimeout(()=>window.scrollTo({top:0,behavior:"smooth"}), 50);
  const showToast = msg => { setToast(msg); setTimeout(()=>setToast(null), 2600); };

  const season = getSeason();
  const si = SEASON_INFO[season];
  const homeDays  = DAYS.filter(d=>dayConfig[d]==="home");
  const goustoDays = DAYS.filter(d=>dayConfig[d]==="gousto");

  const generate = () => {
    const wkday = homeDays.filter(d=>!WEEKEND.includes(d));
    const wkend = homeDays.filter(d=> WEEKEND.includes(d));
    const opts = { history:mealHistory, favourites, dislikes };
    const wkdayPicks = smartPick(getPool("weekday", timeFilter, customMeals), wkday.length, opts);
    const wkendPicks = smartPick(getPool("weekend", timeFilter, customMeals), wkend.length, opts);
    const meals = [...wkdayPicks.map((m,i)=>({...m,day:wkday[i]})), ...wkendPicks.map((m,i)=>({...m,day:wkend[i]}))];
    const newPlan = { meals };
    const newShop = buildShop(newPlan, pantry, familySize);
    const now = Date.now();
    const newHistory = [...mealHistory, ...meals.map(m=>({name:m.name,date:now}))].filter(h=>now-h.date<60*24*60*60*1000);
    setMealHistory(newHistory); save(SK.HISTORY, newHistory); save(SK.PANTRY, pantry);
    setPlan(newPlan); setShopList(newShop); setChecked({}); setExpandedDay(null); setStep("plan");
    const ns={dayConfig,familySize,timeFilter,plan:newPlan,shopList:newShop};
    setSavedState(ns); save(SK.STATE, ns); scrollTop();
  };

  const swap = (day, extraDislikes=[]) => {
    const pool = getPool(WEEKEND.includes(day)?"weekend":"weekday", timeFilter, customMeals);
    const used = plan.meals.map(m=>m.name);
    const allD = [...dislikes, ...extraDislikes];
    const avail = pool.filter(m=>!used.includes(m.name)&&!allD.includes(m.name));
    if(!avail.length){ showToast("No more meals to swap to!"); return; }
    const r = avail[Math.floor(Math.random()*avail.length)];
    const newPlan = { meals:plan.meals.map(m=>m.day===day?{...r,day}:m) };
    const newShop = buildShop(newPlan, pantry, familySize);
    setPlan(newPlan); setShopList(newShop);
    const ns={...savedState,plan:newPlan,shopList:newShop};
    setSavedState(ns); save(SK.STATE, ns);
    showToast("Swapped to "+r.name);
  };

  const toggleFav = name => {
    const isFav = favourites.includes(name);
    const nf = isFav?favourites.filter(f=>f!==name):[...favourites,name];
    setFavourites(nf); save(SK.FAVS, nf);
    showToast(isFav?"Removed from favourites":"Added to favourites ⭐");
  };
  const addDislike = name => {
    const nd=[...dislikes,name]; setDislikes(nd); save(SK.DISLIKES, nd);
    showToast("Won't suggest this again");
    const mealDay = plan?.meals.find(m=>m.name===name)?.day;
    if(mealDay) swap(mealDay,[name]);
  };
  const removeDislike = name => {
    const nd=dislikes.filter(d=>d!==name); setDislikes(nd); save(SK.DISLIKES, nd);
    showToast("Restored ✓");
  };
  const addCustom = meal => { const nc=[...customMeals,meal]; setCustomMeals(nc); save(SK.CUSTOM,nc); };
  const deleteCustom = name => { const nc=customMeals.filter(m=>m.name!==name); setCustomMeals(nc); save(SK.CUSTOM,nc); showToast("Meal removed"); };

  const restoreSaved = () => {
    if(!savedState)return;
    if(savedState.dayConfig) setDayConfig(savedState.dayConfig);
    if(savedState.familySize) setFamilySize(savedState.familySize);
    if(savedState.timeFilter) setTimeFilter(savedState.timeFilter);
    setPlan(savedState.plan);
    setShopList(savedState.shopList||buildShop(savedState.plan,pantry,savedState.familySize||4));
    setChecked({}); setExpandedDay(null); setStep("plan"); scrollTop();
  };

  const reset = () => {
    setSavedState(null); save(SK.STATE,null);
    setPlan(null); setShopList(null); setChecked({}); setExpandedDay(null);
    setStep("setup"); scrollTop();
  };

  const doShare = () => {
    const encoded = encodePlan(plan,dayConfig,familySize,customMeals);
    const url = location.origin+location.pathname+'#share='+encoded;
    if(navigator.share){ navigator.share({title:"Our Meal Plan",url}).catch(()=>{}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>showToast("Share link copied!")); }
    else { showToast("Copy not supported — try another browser"); }
  };

  const importShared = () => {
    if(!sharedPlan)return;
    setDayConfig(sharedPlan.dayConfig||DEFAULT_DAY_CFG);
    setFamilySize(sharedPlan.familySize||4);
    setPlan(sharedPlan);
    setShopList(buildShop(sharedPlan,pantry,sharedPlan.familySize||4));
    setChecked({}); setExpandedDay(null); setStep("plan");
    window.history.replaceState(null,'',location.pathname); scrollTop();
  };

  if(showPrefs) return (
    <>
      <PrefsScreen favourites={favourites} dislikes={dislikes} customMeals={customMeals}
        onToggleFav={toggleFav} onRemoveDislike={removeDislike}
        onAddCustom={addCustom} onDeleteCustom={deleteCustom}
        onClearAll={()=>{setFavourites([]);setDislikes([]);save(SK.FAVS,[]);save(SK.DISLIKES,[]);showToast("Cleared");}}
        onClose={()=>setShowPrefs(false)} showToast={showToast} />
      {toast&&<div className="toast">{toast}</div>}
    </>
  );

  if(step==="shared"&&sharedPlan){
    const spGousto = Object.entries(sharedPlan.dayConfig||{}).filter(([,v])=>v==='gousto').map(([k])=>k);
    return (
      <div>
        <div style={{ background:`linear-gradient(135deg,${P.accent},${P.accentDark})`, color:"#fff", padding:"48px 24px 28px", textAlign:"center" }}>
          <h1 style={{ fontFamily:"'DM Serif Display',Georgia,serif", fontSize:"26px" }}>Shared Meal Plan</h1>
          <div style={{ fontSize:"14px", opacity:0.85, marginTop:"6px" }}>Serves {sharedPlan.familySize} · {sharedPlan.meals.length} meals planned</div>
        </div>
        <div style={{ maxWidth:"480px", margin:"0 auto", padding:"20px 16px 100px" }}>
          <p style={{ fontSize:"14px", color:P.muted, marginBottom:"16px" }}>This plan was shared with you. You can use it as-is or plan your own week.</p>
          {DAYS.map(day=>{
            if(spGousto.includes(day)) return (
              <div key={day} style={{ background:P.card, borderRadius:"16px", padding:"16px 18px", marginBottom:"10px",
                boxShadow:P.shadow, border:`1px solid ${P.border}`, display:"flex", gap:"14px", opacity:0.55 }}>
                <div style={{ fontSize:"26px" }}>📦</div>
                <div>
                  <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"12px", color:P.accent, textTransform:"uppercase" }}>{day}</div>
                  <div style={{ fontWeight:700, fontSize:"16px" }}>Gousto</div>
                </div>
              </div>
            );
            const meal=sharedPlan.meals.find(m=>m.day===day);
            if(!meal)return null;
            return <MealCard key={day} meal={meal} day={day} isFav={false} isSeasonal={false}
              seasonLabel="" expanded={expandedDay===day} familySize={sharedPlan.familySize}
              onExpand={()=>setExpandedDay(expandedDay===day?null:day)} readOnly={true} />;
          })}
          <Primary onClick={importShared}>Use this plan</Primary>
          <Secondary onClick={()=>{window.history.replaceState(null,'',location.pathname);setStep("setup");}}>Plan my own week</Secondary>
        </div>
        {toast&&<div className="toast">{toast}</div>}
      </div>
    );
  }

  return (
    <div>
      <div style={{ background:`linear-gradient(135deg,${P.accent},${P.accentDark})`, color:"#fff", padding:"48px 24px 24px" }}>
        <div style={{ maxWidth:"480px", margin:"0 auto", display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div>
            <h1 style={{ fontFamily:"'DM Serif Display',Georgia,serif", fontSize:"26px", margin:0, lineHeight:1.2 }}>Weekly Dinner Planner</h1>
            <div style={{ fontSize:"13px", opacity:0.85, marginTop:"5px" }}>Quick, kid-friendly meals for the family</div>
          </div>
          <button onClick={()=>setShowPrefs(true)} style={{ background:"rgba(255,255,255,0.2)", border:"none",
            color:"white", borderRadius:"10px", padding:"8px 10px", cursor:"pointer", fontSize:"18px", flexShrink:0, marginTop:"2px" }}>⚙️</button>
        </div>
      </div>

      {(step==="setup"||step==="pantry") && (
        <div style={{ display:"flex", gap:"6px", padding:"14px 24px 0", maxWidth:"480px", margin:"0 auto" }}>
          {[0,1].map(i=><div key={i} style={{ flex:1, height:"4px", borderRadius:"2px",
            background:i<(step==="pantry"?1:0)?P.accent:i===(step==="pantry"?1:0)?P.accentLight:P.border }} />)}
        </div>
      )}

      <div style={{ maxWidth:"480px", margin:"0 auto", padding:"20px 16px 110px" }}>

        {step==="setup" && (
          <div className="fade-in">
            <div style={{ background:P.accentLight, borderRadius:"12px", padding:"11px 16px", marginBottom:"16px", fontSize:"13px", color:P.accentDark, fontWeight:600 }}>
              {si.label} — {si.tip}
            </div>
            {savedState?.plan && (
              <div onClick={restoreSaved} style={{ background:P.card, borderRadius:"16px", padding:"14px 18px",
                marginBottom:"16px", boxShadow:P.shadow, border:`2px solid ${P.accent}`, cursor:"pointer" }}>
                <div style={{ fontSize:"11px", color:P.accent, fontWeight:700, textTransform:"uppercase", letterSpacing:"1px", marginBottom:"3px" }}>Resume</div>
                <div style={{ fontWeight:700, fontSize:"16px" }}>Continue last week's plan →</div>
                <div style={{ fontSize:"13px", color:P.muted, marginTop:"2px" }}>{savedState.plan.meals.length} meals planned · tap to resume</div>
              </div>
            )}
            <div style={{ fontSize:"11px", textTransform:"uppercase", letterSpacing:"1.5px", color:P.accent, fontWeight:700, marginBottom:"5px" }}>Step 1 of 2</div>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"22px", lineHeight:1.3, marginBottom:"16px" }}>Set up this week</div>

            {/* Family size */}
            <div style={{ background:P.card, borderRadius:"14px", padding:"14px 18px", marginBottom:"10px", boxShadow:P.shadow, border:`1px solid ${P.border}`, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <div>
                <div style={{ fontWeight:700, fontSize:"15px" }}>Family size</div>
                <div style={{ fontSize:"13px", color:P.muted }}>Scales ingredient quantities</div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:"12px" }}>
                <button onClick={()=>setFamilySize(s=>Math.max(1,s-1))} style={{ width:"32px", height:"32px", borderRadius:"8px", border:`2px solid ${P.border}`, background:P.card, fontSize:"18px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700 }}>−</button>
                <span style={{ fontSize:"18px", fontWeight:700, minWidth:"20px", textAlign:"center" }}>{familySize}</span>
                <button onClick={()=>setFamilySize(s=>Math.min(8,s+1))} style={{ width:"32px", height:"32px", borderRadius:"8px", border:`2px solid ${P.border}`, background:P.card, fontSize:"18px", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700 }}>+</button>
              </div>
            </div>

            {/* Time filter */}
            <div style={{ background:P.card, borderRadius:"14px", padding:"14px 18px", marginBottom:"10px", boxShadow:P.shadow, border:`1px solid ${P.border}` }}>
              <div style={{ fontWeight:700, fontSize:"15px", marginBottom:"10px" }}>Max cook time</div>
              <div style={{ display:"flex", gap:"8px" }}>
                {[["any","Any time"],["25","≤ 25 min"],["15","≤ 15 min"]].map(([val,label])=>(
                  <button key={val} onClick={()=>setTimeFilter(val)} style={{ flex:1, padding:"10px 4px", borderRadius:"10px",
                    border:`2px solid ${timeFilter===val?P.accent:P.border}`,
                    background:timeFilter===val?P.accent:P.card, color:timeFilter===val?"#fff":P.text,
                    fontSize:"13px", fontWeight:700, cursor:"pointer" }}>{label}</button>
                ))}
              </div>
            </div>

            {/* Day grid */}
            <div style={{ background:P.card, borderRadius:"14px", padding:"14px 18px", boxShadow:P.shadow, border:`1px solid ${P.border}`, marginBottom:"16px" }}>
              <div style={{ fontWeight:700, fontSize:"15px", marginBottom:"3px" }}>Days this week</div>
              <div style={{ fontSize:"13px", color:P.muted, marginBottom:"12px" }}>Tap to cycle: Home cooked → Gousto → Day off</div>
              {DAYS.map((day,idx)=>{
                const val = dayConfig[day]||"home";
                const cycle = {home:"gousto",gousto:"off",off:"home"};
                const labels = {home:"Home",gousto:"Gousto",off:"Day off"};
                const icons  = {home:WEEKEND.includes(day)?"🥩":"🍝",gousto:"📦",off:"—"};
                const colors = {home:[P.accentLight,P.accentDark],gousto:[P.greenLight,P.greenDark],off:["#F0F0F0",P.muted]};
                return (
                  <div key={day} onClick={()=>setDayConfig(prev=>({...prev,[day]:cycle[prev[day]||"home"]}))}
                    style={{ display:"flex", alignItems:"center", justifyContent:"space-between",
                      padding:"10px 0", borderBottom:idx<6?`1px solid ${P.border}`:"none",
                      cursor:"pointer", opacity:val==="off"?0.45:1 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:"10px" }}>
                      <span style={{ fontSize:"20px" }}>{icons[val]}</span>
                      <span style={{ fontWeight:600, fontSize:"15px" }}>{day}</span>
                    </div>
                    <span style={{ background:colors[val][0], color:colors[val][1],
                      borderRadius:"8px", padding:"4px 12px", fontSize:"13px", fontWeight:700 }}>
                      {labels[val]}
                    </span>
                  </div>
                );
              })}
            </div>

            {homeDays.length===0
              ? <p style={{ textAlign:"center", color:P.muted, fontSize:"14px", marginBottom:"8px" }}>Mark at least one day as Home cooked to generate a plan.</p>
              : null}
            <Primary disabled={homeDays.length===0} onClick={()=>{setStep("pantry");scrollTop();}}>
              Next — {homeDays.length} meal{homeDays.length!==1?"s":""} to plan
            </Primary>
          </div>
        )}

        {step==="pantry" && (
          <div className="fade-in">
            <div style={{ fontSize:"11px", textTransform:"uppercase", letterSpacing:"1.5px", color:P.accent, fontWeight:700, marginBottom:"5px" }}>Step 2 of 2</div>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"22px", lineHeight:1.3, marginBottom:"8px" }}>What do you already have?</div>
            <p style={{ fontSize:"14px", color:P.muted, marginBottom:"16px" }}>We'll leave these off the shopping list. Or skip this.</p>
            <textarea style={{ width:"100%", padding:"14px 16px", border:`2px solid ${P.border}`, borderRadius:"14px",
              fontSize:"15px", marginBottom:"8px", resize:"vertical", minHeight:"80px" }}
              placeholder="e.g. chicken, pasta, rice, tinned tomatoes, onions, cheese…"
              value={pantry} onChange={e=>setPantry(e.target.value)} />
            <Primary onClick={generate}>Generate Meal Plan</Primary>
            <Secondary onClick={()=>{setStep("setup");scrollTop();}}>Back</Secondary>
          </div>
        )}

        {step==="plan" && plan && (
          <div className="fade-in">
            <div style={{ fontSize:"11px", textTransform:"uppercase", letterSpacing:"1.5px", color:P.accent, fontWeight:700, marginBottom:"5px" }}>Your week</div>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"22px", lineHeight:1.3, marginBottom:"4px" }}>Here's the plan</div>
            <p style={{ fontSize:"13px", color:P.muted, marginBottom:"16px" }}>Tap a card for recipe &amp; ingredients · ☆ favourite · 🔄 swap · 👎 skip forever</p>
            {DAYS.map(day=>{
              if(dayConfig[day]==="off") return null;
              if(goustoDays.includes(day)) return (
                <div key={day} style={{ background:P.card, borderRadius:"16px", padding:"16px 18px", marginBottom:"10px",
                  boxShadow:P.shadow, border:`1px solid ${P.border}`, display:"flex", gap:"14px", opacity:0.55 }}>
                  <div style={{ fontSize:"26px" }}>📦</div>
                  <div>
                    <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"12px", color:P.accent, textTransform:"uppercase", marginBottom:"3px" }}>{day}</div>
                    <div style={{ fontWeight:700, fontSize:"16px", marginBottom:"2px" }}>Gousto</div>
                    <div style={{ fontSize:"13px", color:P.muted }}>Meal kit — sorted!</div>
                  </div>
                </div>
              );
              const meal=plan.meals.find(m=>m.day===day);
              if(!meal)return null;
              return <MealCard key={day} meal={meal} day={day}
                isFav={favourites.includes(meal.name)}
                isSeasonal={!!(meal.seasons&&meal.seasons.includes(season))}
                seasonLabel={si.label} expanded={expandedDay===day} familySize={familySize}
                onExpand={()=>setExpandedDay(expandedDay===day?null:day)}
                onFav={()=>toggleFav(meal.name)} onSwap={()=>swap(day)}
                onDislike={()=>addDislike(meal.name)} readOnly={false} />;
            })}
            <Primary onClick={()=>{setStep("shopping");scrollTop();}}>View Shopping List</Primary>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px", marginTop:"10px" }}>
              <button onClick={()=>downloadICS(plan)} style={{ background:P.card, color:P.accent, border:`2px solid ${P.accent}`,
                borderRadius:"14px", padding:"13px 10px", fontSize:"14px", fontWeight:700, cursor:"pointer", textAlign:"center" }}>
                📅 Calendar
              </button>
              <button onClick={doShare} style={{ background:P.card, color:P.accent, border:`2px solid ${P.accent}`,
                borderRadius:"14px", padding:"13px 10px", fontSize:"14px", fontWeight:700, cursor:"pointer", textAlign:"center" }}>
                🔗 Share
              </button>
            </div>
            <Secondary onClick={generate}>Shuffle all meals</Secondary>
            <Secondary muted onClick={reset}>Start over</Secondary>
          </div>
        )}

        {step==="shopping" && shopList && (
          <div className="fade-in">
            <div style={{ fontSize:"11px", textTransform:"uppercase", letterSpacing:"1.5px", color:P.accent, fontWeight:700, marginBottom:"5px" }}>Shopping list</div>
            <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:"22px", lineHeight:1.3, marginBottom:"4px" }}>
              {Object.entries(shopList).reduce((n,[,items])=>n+items.filter(item=>checked[Object.keys(shopList).find(c=>shopList[c].includes(item))+':'+item.display]).length,0)} of {Object.values(shopList).flat().length} items
            </div>
            <div style={{ fontSize:"13px", color:P.muted, marginBottom:"16px" }}>Scaled for {familySize} · tap to check off</div>
            {Object.entries(shopList).map(([cat,items])=>(
              <div key={cat} style={{ marginBottom:"12px" }}>
                <div style={{ fontSize:"11px", fontWeight:700, color:P.muted, textTransform:"uppercase", letterSpacing:"1.5px", marginBottom:"6px", paddingLeft:"4px" }}>{cat}</div>
                <div style={{ background:P.card, borderRadius:"16px", padding:"4px 18px", boxShadow:P.shadow, border:`1px solid ${P.border}` }}>
                  {items.map((item,i)=>{
                    const key=cat+':'+item.display;
                    return (
                      <div key={key} onClick={()=>setChecked(prev=>({...prev,[key]:!prev[key]}))}
                        style={{ display:"flex", alignItems:"center", gap:"12px", padding:"11px 0",
                          borderBottom:i<items.length-1?`1px solid ${P.border}`:"none", cursor:"pointer" }}>
                        <div style={{ width:"24px", height:"24px", borderRadius:"7px",
                          border:`2px solid ${checked[key]?P.green:P.border}`,
                          background:checked[key]?P.greenLight:"#fff",
                          display:"flex", alignItems:"center", justifyContent:"center",
                          flexShrink:0, fontSize:"13px", color:P.greenDark, fontWeight:700 }}>
                          {checked[key]?"✓":""}
                        </div>
                        <div style={{ fontSize:"14px", textDecoration:checked[key]?"line-through":"none",
                          color:checked[key]?P.muted:P.text, flex:1 }}>{item.display}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
            <Primary onClick={()=>{
              const unchecked=[];
              Object.entries(shopList).forEach(([cat,items])=>items.forEach(item=>{if(!checked[cat+':'+item.display])unchecked.push(item.display);}));
              if(navigator.share){navigator.share({title:"Shopping List",text:unchecked.join('\n')}).catch(()=>{});}
              else if(navigator.clipboard){navigator.clipboard.writeText(unchecked.join('\n')).then(()=>showToast("Copied!"));}
            }}>Share / Copy remaining</Primary>
            <Secondary onClick={()=>{setStep("plan");scrollTop();}}>Back to meals</Secondary>
            <Secondary muted onClick={reset}>Plan another week</Secondary>
          </div>
        )}
      </div>
      {toast&&<div className="toast">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>

<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
