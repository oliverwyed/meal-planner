<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans','Helvetica Neue',sans-serif;background:#FAFAF7;color:#2D3436;min-height:100vh}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease forwards}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
button{-webkit-appearance:none;transition:transform 0.1s,opacity 0.1s}
button:active{transform:scale(0.95)}
textarea,input,select{font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{display:none}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#2D3436;color:#fff;
  padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;
  animation:slideUp 0.25s ease;white-space:nowrap;pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,0.25)}
.expand-body{overflow:hidden;transition:max-height 0.35s ease,opacity 0.25s ease}
</style>

    <div style="font-family:sans-serif;color:#636E72;font-size:14px">Loading…</div></div>

<script>
/* ── Data & Utilities (plain JS, not Babel-compiled) ─────────────────────── */
var SK={HISTORY:'mp_history',FAVS:'mp_favs',DISLIKES:'mp_dislikes',PANTRY:'mp_pantry',
        STATE:'mp_state',CUSTOM:'mp_custom',FAMILY:'mp_family',FILTER:'mp_filter',DAYS_CFG:'mp_days_cfg'};
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

var P={bg:"#FAFAF7",card:"#FFF",accent:"#E07A5F",accentLight:"#F4D1C7",accentDark:"#C25B3F",
       green:"#81B29A",greenLight:"#D4EDDA",greenDark:"#5A8A6E",
       gold:"#D4A017",goldLight:"#FEF3DC",
       text:"#2D3436",muted:"#636E72",border:"#E8E4DF",
       shadow:"0 2px 16px rgba(0,0,0,0.06)",shadowMd:"0 4px 24px rgba(0,0,0,0.10)"};

var DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var WEEKEND=["Saturday","Sunday"];
var EMOJIS={Monday:"🍝",Tuesday:"🥘",Wednesday:"🐟",Thursday:"🍗",Friday:"🌮",Saturday:"🥩",Sunday:"🍕"};
var SEASON_INFO={spring:{label:"🌸 Spring",tip:"lighter meals & spring veg"},
                 summer:{label:"☀️ Summer",tip:"fresh, quick & colourful"},
                 autumn:{label:"🍂 Autumn",tip:"hearty bakes & warming bowls"},
                 winter:{label:"❄️ Winter",tip:"comfort food season"}};
var DEFAULT_DAY_CFG={Monday:"home",Tuesday:"home",Wednesday:"home",Thursday:"home",
                     Friday:"home",Saturday:"home",Sunday:"home"};
var CATEGORY_ORDER=["Meat & Fish","Dairy & Eggs","Frozen","Tins & Pantry",
                    "Pasta, Rice & Grains","Bread & Wraps","Fresh Produce"];

/* ── Meal data ────────────────────────────────────────────────────────────── */
var WEEKDAY_MEALS=[
{name:"Mini Meatball Pasta",time:"12 min",minutes:12,protein:"beef",cuisine:"italian",serves:4,
 description:"Tender meatballs rolled in a deep, herb-scented passata cling to every ridge of penne — the kind of bowl that looks like it took an hour. A weeknight staple that earns its place on repeat.",kidNote:"Halve the meatballs for small children so they're easy to manage",
 ingredients:["400g penne pasta","12 pre-made beef meatballs","400g passata","1 tsp dried oregano","30g parmesan"],
 steps:["Bring a large pot of well-salted water to a boil and cook penne according to pack instructions.","Meanwhile, pour passata into a wide pan, add oregano, and season generously with salt and pepper. Bring to a gentle simmer over medium heat.","Add the meatballs, cover with a lid, and cook 6–8 min, turning once, until heated all the way through and the sauce has deepened in colour.","Reserve a small cup of pasta water, then drain. Add the pasta directly to the sauce pan and toss over the heat for 1 min, adding a splash of pasta water to bring it together.","Serve in warmed bowls with parmesan grated over the top."],
 tip:"A splash of the starchy pasta water is the secret to a glossy, clingy sauce — add it just before serving and toss vigorously so every piece of penne is coated."},

{name:"Chicken & Sweetcorn Rice",time:"15 min",minutes:15,protein:"chicken",cuisine:"asian",serves:4,
 description:"Juicy golden chicken with pops of sweetcorn and peas, lifted by a salty-sweet soy glaze and piled onto fluffy rice. Bright, fast, and endlessly satisfying.",kidNote:"Great as finger food — dice the chicken small and let them eat it with a spoon",
 ingredients:["2 chicken breasts","250g microwave rice","150g frozen sweetcorn","100g frozen peas","2 tbsp soy sauce","1 tbsp vegetable oil"],
 steps:["Dice chicken into small, even pieces (about 2cm) and season lightly with salt — even sizing means it all cooks at the same rate.","Heat oil in a wide frying pan or wok over high heat until shimmering. Add chicken in a single layer and leave it alone for 2 min to get a proper golden crust before stirring.","Continue cooking, stirring, for another 3–4 min until cooked through with no pink remaining.","Microwave rice per pack instructions. Add sweetcorn and peas to the chicken pan; stir-fry for 2 min until the veg is heated through and bright.","Add rice and soy sauce; toss everything together over high heat for 1 min. Taste — it may need another splash of soy — and serve."],
 tip:"The key to golden, not steamed, chicken is a screaming-hot pan and not overcrowding it — if the pieces touch and steam, they'll stay pale and soft rather than getting that caramelised crust."},

{name:"Fish Finger Wraps",time:"15 min",minutes:15,protein:"fish",cuisine:"british",seasons:["spring","summer"],serves:4,
 description:"Crispy golden fish fingers tucked into warm, soft tortillas with cool cucumber, sharp cheddar and a swipe of mayo — a seaside supper in wrap form. Ready in the time it takes to heat the oven.",kidNote:"Let the kids assemble their own wraps — it's half the fun and means fussy eaters stay involved",
 ingredients:["10 fish fingers","4 soft tortillas","1 cucumber","80g cheddar cheese","3 tbsp mayonnaise"],
 steps:["Preheat oven to 200°C / 180°C fan. Lay fish fingers in a single layer on a baking tray with space between them — they crisp, not steam, that way. Bake for 15 min, turning halfway, until deep golden and crisp all over.","While the fish fingers bake, slice cucumber into long, thin sticks and grate or thinly slice the cheddar.","Warm tortillas in the microwave, wrapped in damp kitchen paper, for 20–30 seconds until pliable and soft.","Spread a generous layer of mayo across each tortilla. Lay 2–3 fish fingers along the centre, then add cucumber sticks and cheese.","Roll firmly, tucking in the sides, and halve on the diagonal. Serve with ketchup for dipping."],
 tip:"Turning the fish fingers halfway through baking ensures even crunch on both sides — skipping this leaves one side soggy where it's been sitting in its own steam."},

{name:"One-Pot Cheesy Pasta",time:"15 min",minutes:15,protein:"pork",cuisine:"british",seasons:["autumn","winter"],serves:4,
 description:"Spirals of pasta coated in a velvety cream cheese sauce with nuggets of sweet ham and sweetcorn — rich, comforting, and made entirely in one pan. The sauce practically makes itself.",kidNote:"Mild and creamy — an easy crowd pleaser that younger children tend to love",
 ingredients:["300g fusilli pasta","150g cream cheese","150g frozen sweetcorn","150g ham slices","50g cheddar cheese"],
 steps:["Cook fusilli in well-salted boiling water per pack instructions. Before draining, scoop out a generous cup of starchy pasta water and set aside — you'll need it.","Drain the pasta and return it to the warm pan off the heat. The residual warmth is enough to melt the sauce without splitting it.","Add the cream cheese and a good splash of pasta water. Stir vigorously until the cheese melts into a glossy, coating sauce — add more pasta water if it looks too thick.","Roughly chop the ham and stir in along with the frozen sweetcorn. Return to a low heat for 1–2 min, stirring, until the sweetcorn is hot and the ham is warmed through.","Taste and season with salt and plenty of black pepper. Serve topped with grated cheddar."],
 tip:"Taking the pan off the heat before adding the cream cheese prevents it from splitting and going grainy — the pasta holds enough warmth to melt it into a beautifully smooth sauce."},

{name:"Chicken Quesadillas",time:"12 min",minutes:12,protein:"chicken",cuisine:"mexican",serves:4,
 description:"Shatteringly crisp tortillas filled with melting cheddar, shredded chicken and sweet red pepper — the cheese pull is real. Cut into wedges and watch them disappear.",kidNote:"Slice into triangles for small children — easy to hold and the crispy shell makes it exciting to eat",
 ingredients:["2 cooked chicken breasts","4 flour tortillas","100g cheddar cheese","1 red pepper","2 tbsp vegetable oil"],
 steps:["Shred the chicken into thin strips. Dice the pepper into small pieces. Grate the cheddar — fine grating helps it melt quickly and evenly.","Divide the filling across one half of each tortilla: chicken first, then pepper, then a generous layer of cheese. Fold the empty half over to form a half-moon.","Heat a dry (no oil) frying pan over medium-high heat until hot. A dry pan means the tortilla toasts and crisps rather than frying and going greasy.","Cook one quesadilla at a time for 2–3 min per side, pressing down gently with a spatula, until deep golden and crisp. You should hear it sizzling actively.","Transfer to a board, rest for 1 min so the filling sets slightly, then slice into wedges with a sharp knife. Repeat with remaining quesadillas."],
 tip:"A completely dry, hot pan gives you that audible crunch and golden colour — adding oil makes the tortilla greasy and soft rather than shatteringly crisp."},

{name:"Salmon & Noodle Stir Fry",time:"15 min",minutes:15,protein:"fish",cuisine:"asian",seasons:["spring","summer"],serves:4,
 description:"Silky egg noodles and vibrant stir-fried veg tossed with lacquered teriyaki and gently folded through flakes of just-cooked salmon. Elegant enough for grown-ups, gentle enough for children.",kidNote:"Flake the salmon into smaller pieces for young children and always check carefully for any bones",
 ingredients:["2 salmon fillets","300g egg noodles","150g frozen stir fry veg","3 tbsp teriyaki sauce","1 tbsp sesame oil"],
 steps:["Cook noodles per pack instructions, drain, and toss immediately with a few drops of sesame oil to stop them clumping together.","Pat salmon fillets dry — this is what gets you a golden crust rather than pale, steamed fish. Season well with salt.","Heat remaining sesame oil in a non-stick pan over medium-high heat. Cook salmon skin-side down for 3–4 min until the skin is crisp, then flip and cook 2 min more. The flesh should be just opaque in the centre. Remove and set aside.","Add the stir-fry veg to the same hot pan; cook over high heat for 3 min, tossing regularly, until tender-crisp and starting to char at the edges.","Add noodles and teriyaki sauce; toss together for 1 min until everything is coated and glossy. Flake the salmon over in large pieces and fold in gently so it doesn't break up entirely."],
 tip:"Patting the salmon completely dry before cooking is non-negotiable — any surface moisture creates steam that prevents the skin from crisping and gives you a pale, soft result instead."},

{name:"Ham & Cheese Pitta Pizzas",time:"10 min",minutes:10,protein:"pork",cuisine:"italian",serves:4,
 description:"Chewy pitta bases blistered under the grill, topped with passata, torn mozzarella and salty ham — all the pleasure of pizza in a fraction of the time. A brilliant five-minute assembly job.",kidNote:"Children love building their own — set out the toppings and let them go",
 ingredients:["4 pitta breads","4 tbsp passata","125g mozzarella","100g ham slices","1 tsp dried oregano"],
 steps:["Position your oven shelf close to the grill element and preheat the grill to its highest setting — a fiercely hot grill is what makes the cheese bubble and blister properly.","Lay pittas on a baking tray. Spread a tablespoon of passata over each, going almost to the edge, and season with a small pinch of salt.","Tear the mozzarella into rough pieces and scatter evenly over each pitta. Lay on slices of ham, then sprinkle with dried oregano.","Slide under the hot grill and cook for 4–5 min, watching closely, until the cheese is deeply golden and bubbling and the pitta edges have gone crisp and toasty.","Leave to cool for a full minute before serving — molten mozzarella holds its heat and can burn small mouths."],
 tip:"The closer the tray is to the grill element, the faster the cheese bubbles and the better the colour — if the cheese is melted but pale after 5 minutes, your grill isn't hot enough or the tray is too far away."},

{name:"Pesto Pasta with Peas",time:"12 min",minutes:12,protein:"veggie",cuisine:"italian",seasons:["spring","summer"],serves:4,
 description:"Pasta shells cupping vivid green pesto, with bursts of sweet pea threaded through every mouthful. The trick is off-the-heat mixing — it keeps the pesto fresh and grassy rather than dull and oily.",kidNote:"The bright green colour makes this one genuinely exciting for small children",
 ingredients:["300g pasta shells","4 tbsp green pesto","200g frozen peas","30g parmesan","1 tbsp olive oil"],
 steps:["Cook pasta in well-salted boiling water per pack instructions. In the last 2 min, add the frozen peas directly to the pasta water — they'll be perfectly cooked when the pasta is ready.","Reserve a generous cup of pasta water before draining — this is your secret weapon for a silky sauce.","Drain pasta and peas together and return to the warm pan, removing from the heat completely.","Add pesto and olive oil, then toss well. Add pasta water a splash at a time until the pesto loosens into a glossy coating sauce that clings to every shell.","Taste for seasoning, then serve with parmesan freshly grated over the top."],
 tip:"Never add pesto over heat — the basil turns bitter and brown almost immediately; off the heat, the colour stays vivid green and the flavour stays bright and fresh."},

{name:"Egg Fried Rice",time:"15 min",minutes:15,protein:"eggs",cuisine:"asian",serves:4,
 description:"Fluffy grains of rice, streaked with ribbons of soft scrambled egg and dotted with sweet peas and sweetcorn, all bound with a savoury soy glaze. This is how to turn leftover rice into something you'd order in a restaurant.",kidNote:"A gentle, familiar flavour — most children take to this quickly",
 ingredients:["2 packs microwave rice","3 eggs","150g frozen peas","150g frozen sweetcorn","2 tbsp soy sauce","1 tbsp vegetable oil"],
 steps:["Microwave both rice packs per instructions. Tip into a large, wide frying pan or wok and spread into an even layer.","Stir-fry over the highest heat you have for 2–3 min, tossing the rice constantly, until it starts to dry out and some grains catch a little colour — this step is what stops fried rice being claggy and wet.","Push the rice to the sides of the pan, leaving a clear space in the middle. Add a drop more oil, crack in the eggs, and scramble them just until set but still slightly soft. Then stir into the rice immediately.","Add frozen peas and sweetcorn; toss everything together over high heat for 2 min until the veg is hot and bright.","Pour in soy sauce, toss for 30 seconds, then taste — you may want a little more soy. Finish with sesame oil if you have it, and serve immediately."],
 tip:"Starting with properly microwaved (not freshly boiled) rice and drying it out in the hot pan first is what separates restaurant-style fried rice from the stodgy, steamed-vegetable version made with wet rice."},

{name:"Tuna Pasta Bake",time:"18 min",minutes:18,protein:"fish",cuisine:"british",seasons:["autumn","winter"],serves:4,
 description:"Tender pasta, flaked tuna and sweet sweetcorn bound in a creamy sauce and grilled until the top is golden and crackling with melted cheese. Deeply comforting and endlessly adaptable.",kidNote:"A real crowd-pleaser — creamy, mild and very easy for small children to eat",
 ingredients:["300g penne pasta","2 tins tuna","200ml crème fraîche","80g cheddar cheese","100g frozen sweetcorn"],
 steps:["Preheat your grill to its highest setting. Cook pasta in well-salted boiling water per pack, then drain well — excess water will make the sauce watery.","Drain the tuna thoroughly and flake into a large bowl. Add crème fraîche, sweetcorn, and half the grated cheddar. Season generously with salt and black pepper.","Add the drained pasta and mix until everything is evenly coated. Taste and adjust seasoning — the mixture should be well-seasoned before it goes under the grill.","Tip into an ovenproof dish in an even layer. Scatter the remaining cheddar evenly over the top.","Grill for 5–7 min, watching closely, until the top is bubbling and deeply golden in patches. Leave to cool for 2 min before serving — the filling retains heat."],
 tip:"Draining the pasta very thoroughly is essential here — any water clinging to the pasta thins out the crème fraîche and you end up with a loose, runny result instead of a creamy bake."},

{name:"Sausage & Bean One-Pot",time:"15 min",minutes:15,protein:"pork",cuisine:"british",seasons:["autumn","winter"],serves:4,
 description:"Deeply browned sausage coins simmered in smoky, rich baked beans until the sauce thickens and clings — piled onto buttery toast, it's the kind of meal that feels like a proper hug.",kidNote:"Slice sausages into small coins before serving for young children",
 ingredients:["6 pork sausages","1 tin baked beans","4 slices bread","1 tbsp vegetable oil","1 tbsp ketchup"],
 steps:["Slice sausages into chunky coins, about 1.5cm thick — this maximises the surface area that can brown.","Heat oil in a wide pan over medium-high heat. Add the sausage pieces in a single layer and cook without moving for 2–3 min until a deep mahogany crust forms underneath. Flip and brown the other side.","Add baked beans and ketchup; stir to combine, scraping up any browned bits from the pan — that's pure flavour.","Reduce heat to medium-low and simmer for 3–4 min, stirring occasionally, until the sauce has thickened slightly and everything is piping hot.","Toast and butter the bread. Serve the sausage and bean mixture spooned generously over the toast."],
 tip:"Leaving the sausage coins undisturbed for a full 2–3 minutes develops a proper caramelised crust — the instinct to stir too soon robs you of the deep brown colour that gives this dish its flavour."},

{name:"Chicken Goujons & Chips",time:"20 min",minutes:20,protein:"chicken",cuisine:"british",serves:4,
 description:"Crispy-coated chicken strips and golden chips from the oven — a proper favourite that requires almost no effort. The trick is giving the chips a head start so everything emerges at exactly the same moment.",kidNote:"Always check a goujon is piping hot all the way through before serving to small children",
 ingredients:["400g chicken breast goujons","400g frozen oven chips","200g frozen peas","2 tbsp ketchup"],
 steps:["Preheat oven to 220°C / 200°C fan — a high temperature is essential for chips that are golden on the outside and fluffy inside, not pale and soggy.","Spread chips in a single layer on a large baking tray (don't overcrowd or they steam and go soft). Bake for 10 min until beginning to colour.","Slide the goujons onto the tray alongside the chips, leaving space around each piece. Bake for a further 10–12 min until the chips are deep golden and the goujons are golden-brown and cooked through.","Cook peas in boiling water for 3 min or microwave with a splash of water; drain.","Serve immediately with ketchup. Cut a goujon open and check the inside is white and steaming hot, with no pink, before giving to children."],
 tip:"The chips need to go in 10 minutes before the goujons because they take longer to cook through — adding everything at once means either underdone chips or overdone chicken."},

{name:"Veggie Omelette",time:"10 min",minutes:10,protein:"eggs",cuisine:"british",serves:4,
 description:"A golden, pillowy omelette with tender courgette, bursting cherry tomatoes and melted cheddar pooling through every fold. One of the fastest, most nourishing things you can put on the table.",kidNote:"Cut into strips or squares for small children — it's soft all the way through and easy to manage",
 ingredients:["6 eggs","60g cheddar cheese","4 cherry tomatoes","1 small courgette","1 tbsp butter","4 slices bread"],
 steps:["Dice the courgette into small cubes (about 1cm). Halve the cherry tomatoes. Grate the cheddar finely — fine grating means it melts into the eggs rather than sitting in clumps.","Melt butter in a wide non-stick pan over medium heat until foaming. Add courgette and cook, stirring, for 2–3 min until just tender and starting to turn golden at the edges.","Beat eggs thoroughly with a generous pinch of salt and plenty of black pepper. Pour over the courgette and let it sit for 30 seconds until the edges just begin to set.","Scatter the halved tomatoes and cheddar evenly over the top. Continue cooking over medium heat until the edges are set and the middle is just barely wobbly — about 2 min.","Fold in half with a spatula and slide onto a board. Toast the bread while the omelette rests for 1 min. Serve cut into strips alongside the toast."],
 tip:"Resist the urge to stir the eggs once they're in the pan — letting them set undisturbed from the bottom up gives you a tender, custardy texture rather than a scrambled mess."},

{name:"Speedy Bolognese",time:"20 min",minutes:20,protein:"beef",cuisine:"italian",serves:4,
 description:"A rich, deeply savoury ragu of beef mince and sweet tomatoes that coats every strand of spaghetti — made in 20 minutes, but it tastes like it's been simmering for much longer. The key is getting the mince genuinely brown.",kidNote:"Use short pasta shapes for toddlers and stir the sauce through so it's not in long strings",
 ingredients:["400g beef mince","400g tin chopped tomatoes","300g spaghetti","1 onion","1 carrot","1 tbsp olive oil","1 tsp dried mixed herbs"],
 steps:["Finely dice onion and carrot — small pieces cook faster and disappear into the sauce. Soften in olive oil over medium heat for 3–4 min, stirring, until the onion is translucent and smells sweet.","Turn heat to high, add the mince and spread it flat. Leave it completely untouched for 2 min so the bottom develops a deep brown crust — this is where the flavour lives.","Break up the mince and continue cooking, stirring occasionally, until all the pink is gone and the mince looks genuinely brown, not grey, about 3 more min.","Add tomatoes, herbs, salt and plenty of black pepper. Stir well, scraping up the browned bits from the pan base. Simmer over medium heat for 8–10 min until the sauce thickens and deepens in colour.","Cook spaghetti in well-salted boiling water per pack. Drain and serve topped with the bolognese."],
 tip:"Resist stirring the mince for the first two minutes so it can develop a proper caramelised crust — that browning is where most of the flavour comes from and makes the difference between a flat sauce and a deeply savoury one."},

{name:"Prawn Stir Fry",time:"12 min",minutes:12,protein:"seafood",cuisine:"asian",seasons:["spring","summer"],serves:4,
 description:"Plump, sweet king prawns and crisp-tender vegetables tossed with silky noodles in a glossy sweet chilli and soy sauce. Fast, vibrant and always impressive for how little effort it takes.",kidNote:"Set aside a plain portion of noodles and veg before adding sauce for very young children",
 ingredients:["250g cooked king prawns","300g egg noodles","200g stir fry vegetables","2 tbsp sweet chilli sauce","1 tbsp soy sauce","1 tbsp vegetable oil"],
 steps:["Cook noodles per pack, drain, and rinse briefly with cold water to stop them cooking and clumping together.","Heat oil in a wok or wide pan over the highest heat you have — the wok should be genuinely smoking before you add anything.","Add the stir-fry veg and toss constantly for 3 min until tender but still with some bite and just beginning to char at the edges.","Add prawns, soy sauce and half the sweet chilli sauce. Toss for 1–2 min until the prawns are heated through and glossy — no longer, or they'll turn rubbery.","Add noodles and toss everything together for 1 min. Serve with the remaining sweet chilli on the side."],
 tip:"A smoking-hot wok is non-negotiable for stir-fry — if you add ingredients to a lukewarm pan, everything steams rather than frying, and you end up with soggy veg and waterlogged noodles."},

{name:"Cheesy Beans on Toast",time:"8 min",minutes:8,protein:"veggie",cuisine:"british",serves:4,
 description:"Thick-cut toast, generously buttered, piled with bubbling hot beans and a crown of golden, melted cheddar. The simplest possible thing, done properly.",kidNote:"Let the toast cool for a minute before serving — the beans hold heat and can be surprisingly hot for small children",
 ingredients:["1 tin baked beans","80g cheddar cheese","4 thick slices bread","1 tbsp butter"],
 steps:["Heat baked beans in a small saucepan over medium heat, stirring frequently, until steaming hot and beginning to bubble at the edges. Season with a little black pepper.","While the beans heat, toast the bread until deep golden-brown — properly toasted bread holds its structure under the beans rather than going soggy immediately.","Grate the cheddar while the toast is still warm so it has a head start on melting.","Butter the toast generously right out of the toaster. Spoon the hot beans on top, then pile over the grated cheddar.","For extra-melty cheese, slide under a hot grill for 1–2 min until bubbling and golden. Serve straight away."],
 tip:"Well-buttered toast forms a barrier that slows sogginess — and serving immediately while both the toast and beans are piping hot makes all the difference between a disappointing and a brilliant result."},

{name:"Chicken Wraps",time:"15 min",minutes:15,protein:"chicken",cuisine:"british",seasons:["spring","summer"],serves:4,
 description:"Pan-fried chicken strips — golden, juicy and lightly seasoned — folded into warm tortillas with crisp lettuce, cool cucumber and a generous swipe of mayo. Fresh, easy, and endlessly variable.",kidNote:"Serve components separately for fussy eaters so they can choose what goes in",
 ingredients:["2 chicken breasts","4 soft tortillas","1 little gem lettuce","1 cucumber","3 tbsp mayonnaise","1 tbsp vegetable oil"],
 steps:["Slice chicken into thin strips, roughly 1cm wide and 6cm long. Season well with salt and pepper — even seasoning is the most important step for flavourful chicken.","Heat oil in a frying pan over medium-high heat until shimmering. Add chicken in a single layer; don't pile them on top of each other or they'll steam.","Cook without touching for 2–3 min until golden-brown on one side, then turn and cook 2–3 min more. The strips should be golden on the outside and white with no pink through the middle.","Wrap tortillas in damp kitchen paper and microwave for 20–30 seconds until soft and pliable.","Shred lettuce and slice cucumber into sticks. Spread mayo on each tortilla, add chicken strips, lettuce and cucumber, then roll firmly and halve on the diagonal."],
 tip:"Cutting the chicken into strips of consistent thickness — not too thin — means they cook evenly and stay juicy; very thin strips overcook and turn dry in the pan before they colour properly."},

{name:"Mac & Cheese",time:"18 min",minutes:18,protein:"veggie",cuisine:"american",seasons:["autumn","winter"],serves:4,
 description:"Perfectly sauced macaroni — tender pasta enrobed in a rich, sharp cheddar béchamel with the warmth of mustard threading through it. The kind of mac and cheese that makes every other version feel inadequate.",kidNote:"As universally loved as it gets — serve with extra cheese on the side for enthusiasts",
 ingredients:["300g macaroni","40g butter","40g plain flour","500ml milk","150g cheddar cheese","1 tsp mustard"],
 steps:["Cook macaroni in well-salted boiling water per pack; drain.","Melt butter in the same pan over medium heat until foaming. Add flour and stir constantly with a wooden spoon for 1 full minute — cooking out the flour taste is essential.","Remove from heat and gradually whisk in the milk, a little at a time, making sure each addition is fully incorporated before adding the next — this prevents lumps.","Return to medium heat and stir continuously until the sauce thickens enough to coat the back of a spoon, about 4–5 min. It should be smooth and glossy.","Take off the heat again; stir in three-quarters of the cheddar and all the mustard. Season well with salt, white pepper and a pinch of nutmeg if you have it. Add the macaroni, stir to coat, and serve with the remaining cheese on top."],
 tip:"Adding the milk off the heat and in small increments — whisking fully between each addition — is the technique that prevents a lumpy béchamel; patience here is the difference between a silky sauce and a grainy one."},

{name:"Bacon & Pea Pasta",time:"12 min",minutes:12,protein:"pork",cuisine:"italian",serves:4,
 description:"Crisp, salty bacon and sweet, yielding peas in a delicate cream sauce that coats every piece of penne — finished with a snow of parmesan. A pasta that feels indulgent but takes less than 15 minutes.",kidNote:"The smoky flavour tends to appeal to children even if they claim not to like bacon",
 ingredients:["300g penne pasta","6 rashers back bacon","200g frozen peas","150ml double cream","30g parmesan","1 tbsp olive oil"],
 steps:["Cook pasta in well-salted boiling water per pack. Add peas in the last 2 min of cooking — they'll be tender and bright green by the time the pasta is ready. Reserve a cup of pasta water before draining.","Meanwhile, dice bacon into rough 1cm pieces. Fry in olive oil over medium-high heat for 3–4 min, tossing occasionally, until the fat has rendered and the pieces are properly crisp at the edges.","Drain pasta and peas, then add directly to the bacon pan over low heat.","Pour in the cream and add a good splash of pasta water. Toss everything together for 1–2 min until the sauce has emulsified into a glossy, clingy coating.","Taste, season with black pepper (salt is likely not needed given the bacon), and serve with parmesan grated over the top."],
 tip:"Adding pasta water to the cream loosens the sauce and, crucially, the starch helps it emulsify — without it, the cream can stay thick and pool at the bottom of the bowl rather than coating the pasta."},

{name:"Sweet & Sour Chicken",time:"15 min",minutes:15,protein:"chicken",cuisine:"asian",serves:4,
 description:"Golden chicken pieces with sweet pineapple and red pepper, glossed in a vibrant, tangy-sweet sauce that clings to every bite. Served over fluffy rice, it's bright and cheerful on the plate and even better to eat.",kidNote:"The natural sweetness of the pineapple makes the sauce very appealing to children",
 ingredients:["2 chicken breasts","1 red pepper","1 small tin pineapple chunks","3 tbsp sweet and sour sauce","2 packs microwave rice","1 tbsp vegetable oil"],
 steps:["Dice chicken into even 2cm cubes; season with salt and pepper. Even sizing is important — different-sized pieces mean some overcook before others are done.","Heat oil in a wok or wide pan over high heat until shimmering. Add chicken in a single layer and cook undisturbed for 2–3 min to develop colour, then toss and cook a further 2–3 min until golden all over and cooked through.","Dice pepper into 2cm chunks. Add to the pan and cook for 2 min, tossing, until the pepper softens slightly but retains a little bite.","Drain the pineapple chunks and add to the pan. Add sweet and sour sauce and stir to coat; cook for 2 min until the sauce is glossy and everything is evenly coated.","Microwave rice per pack; serve the chicken and sauce over the rice."],
 tip:"Cooking the chicken in a single layer without stirring for the first 2 minutes gets you a proper golden crust — piling it in and stirring immediately results in steamed, pale chicken with no colour or flavour development."},

{name:"Bean & Cheese Quesadillas",time:"10 min",minutes:10,protein:"veggie",cuisine:"mexican",serves:4,
 description:"Crispy golden tortillas with a filling of smoky paprika-spiced black beans, sweet sweetcorn and molten cheddar that pulls apart in satisfying strings. Completely plant-based and somehow deeply satisfying.",kidNote:"Great finger food — slice into triangles and serve with a mild salsa for dipping",
 ingredients:["4 flour tortillas","1 tin black beans","100g frozen sweetcorn","100g cheddar cheese","1 tsp smoked paprika"],
 steps:["Drain and rinse black beans thoroughly. Defrost sweetcorn (a minute in the microwave or under warm water). Grate cheddar finely — small grating melts faster and ensures even coverage.","Combine beans, sweetcorn, cheese and smoked paprika in a bowl; season generously with salt and pepper. The filling should taste well-seasoned on its own.","Heat a dry frying pan over medium-high heat. Lay a tortilla flat in the pan, spread half the filling across one half, and fold the other half over to form a half-moon.","Cook for 2–3 min until the underside is deep golden and crisp. Flip carefully and cook 2 min more — listen for the sizzle; it should be active and consistent.","Slide onto a board, rest 30 seconds, then slice into 3 wedges with a sharp knife. Repeat with the second tortilla. Serve with salsa."],
 tip:"Mashing about a third of the beans lightly before combining helps the filling hold together inside the quesadilla — whole beans can roll out as you fold the tortilla, and mashed beans act as a natural binder."},

{name:"Turkey Mince Pasta",time:"18 min",minutes:18,protein:"beef",cuisine:"italian",serves:4,
 description:"Lean turkey mince coaxed into a savoury, herb-scented tomato ragu and tossed through ridged rigatoni. Lighter than a beef bolognese but just as deeply comforting — a brilliant regular.",kidNote:"Rigatoni tubes hold the sauce inside them — cut into pieces for toddlers so they're easier to manage",
 ingredients:["400g turkey mince","400g tin chopped tomatoes","300g rigatoni","1 onion","1 carrot","1 tsp dried mixed herbs","1 tbsp olive oil"],
 steps:["Finely dice onion and carrot into small, even pieces. Heat olive oil in a wide pan over medium heat and cook the onion and carrot, stirring occasionally, for 3–4 min until the onion is soft and translucent.","Add turkey mince, increase heat to medium-high, and cook, breaking it up with a spoon, until no pink remains and the mince starts to colour slightly, about 4–5 min.","Add chopped tomatoes, herbs, salt and pepper. Stir well and simmer over medium heat for 10 min, stirring occasionally, until the sauce reduces and thickens.","Cook rigatoni in well-salted boiling water per pack instructions. Drain, reserving a splash of pasta water.","Add pasta to the sauce with a splash of pasta water and toss to coat. Taste and adjust seasoning before serving."],
 tip:"Turkey mince is leaner than beef and can turn grey and dry if overcooked — keep the heat medium-high and stop cooking as soon as it's no longer pink, then let the sauce do the rest of the work."},

{name:"Veggie Noodle Stir Fry",time:"12 min",minutes:12,protein:"veggie",cuisine:"asian",serves:4,
 description:"Wok-charred vegetables and silky noodles tossed through a fragrant soy and sesame sauce, with soft ribbons of scrambled egg running through every bowlful. Ready in 12 minutes and better than a takeaway.",kidNote:"A gentle savoury flavour that works well for children — skip extra chilli for young ones",
 ingredients:["300g egg noodles","300g stir fry vegetables","2 tbsp soy sauce","1 tbsp sesame oil","1 tbsp vegetable oil","1 tsp garlic granules","2 eggs"],
 steps:["Cook noodles per pack instructions, drain, and toss with a few drops of sesame oil to prevent clumping. Set aside.","Heat vegetable oil in a wok over the highest heat possible until just starting to smoke. Add stir-fry veg and toss constantly for 3–4 min until the veg is tender-crisp, starting to char at the edges and smelling sweet and smoky.","Push the veg to the sides of the wok. Add the remaining sesame oil to the empty centre, crack in both eggs, and scramble them gently until just set — then immediately fold into the vegetables before they firm up.","Add the noodles, soy sauce and garlic granules. Toss everything together vigorously over high heat for 1 min until the noodles are heated through and evenly coated.","Taste — add a splash more soy if needed — and serve immediately. Noodles continue to absorb sauce as they sit, so eat while hot."],
 tip:"The wok must be smoking before anything goes in — a lukewarm wok gives you steamed, waterlogged vegetables instead of the caramelised, charred edges that make a stir fry taste like a stir fry."}
];

var WEEKEND_MEALS=[
{name:"One-Pot Roast Chicken Orzo",time:"40 min",minutes:40,protein:"chicken",cuisine:"italian",seasons:["autumn","winter"],serves:4,
 description:"Crispy-skinned chicken thighs roasted directly on a bed of orzo that has slowly drunk up all the rich, herby stock — the pasta is simultaneously creamy from the inside and toasted where it touches the pan. It looks like a centrepiece but asks almost nothing of you.",kidNote:"The soft, saucy orzo is ideal for young children — serve the chicken shredded off the bone",
 ingredients:["6 chicken thighs","300g orzo pasta","200g cherry tomatoes","100g spinach","500ml chicken stock","1 tbsp olive oil","1 tsp smoked paprika"],
 steps:["Preheat oven to 200°C / 180°C fan. Pat the chicken thighs completely dry with kitchen paper, then season generously all over with paprika, salt and pepper — dry skin is the first step to crispness.","Heat an oven-safe, wide pan or casserole over high heat. Add the chicken thighs skin-side down with no oil and leave undisturbed for 3–4 min until the skin is deeply golden. Flip briefly to seal the underside, then remove and set aside. Don't skip this step — the seared skin stays crispy through the oven.","Pour away all but 1 tbsp of fat from the pan. Add orzo, cherry tomatoes, stock and olive oil; stir well, scraping up any browned bits from the base.","Nestle the chicken thighs skin-side up on top of the orzo — they should sit proud of the liquid. Transfer to the oven and roast, uncovered, for 25–30 min until the chicken skin is crisp and golden and the orzo has absorbed the stock.","Remove from the oven, lay spinach over the top, and stir gently until just wilted — about 1 min. Taste the orzo and adjust seasoning. Serve straight from the pan."],
 tip:"Searing the skin in a dry pan (no extra oil) before the oven renders out the fat and creates a golden crust that actually stays crispy — skipping this step gives you pale, flabby skin no matter how hot the oven."},

{name:"Chicken Fajitas",time:"30 min",minutes:30,protein:"chicken",cuisine:"mexican",serves:4,
 description:"Juicy spiced chicken strips, charred sweet peppers and softened onion piled into warm tortillas — the sizzle when it hits the table is half the experience. Everything cooks in one pan and everyone builds their own.",kidNote:"Set a plain portion of chicken aside before adding the full seasoning if cooking for very young children",
 ingredients:["3 chicken breasts","2 peppers","1 onion","1 pack fajita seasoning","8 soft tortillas","100g cheddar cheese","4 tbsp sour cream","1 tbsp vegetable oil"],
 steps:["Slice chicken breasts into long strips, roughly 1cm wide. Slice peppers and peel and halve the onion, then slice into half-moon strips.","Toss the chicken strips with the fajita seasoning until evenly coated. A well-seasoned coating is what gives fajitas their distinctive flavour — don't be shy.","Heat oil in a wide frying pan or griddle pan over high heat until very hot. Add the chicken in a single layer and cook undisturbed for 2–3 min to colour, then toss and continue cooking for 3–4 min until golden and cooked through. Remove and rest on a plate.","Add the peppers and onion to the same pan over high heat. Cook, tossing occasionally, for 4–5 min until the edges have proper char marks and the onion has softened.","Return chicken to the pan, toss everything together for 1 min, and bring the pan to the table. Warm tortillas in the microwave (30 seconds, wrapped in a damp cloth) and serve with grated cheddar and sour cream."],
 tip:"Cooking the chicken and peppers separately in the same pan in sequence — rather than all at once — means each element gets proper charring rather than stewing together in their own juices."},

{name:"Homemade Pizzas",time:"35 min",minutes:35,protein:"pork",cuisine:"italian",serves:4,
 description:"Blistered, golden-edged bases piled with vivid passata, torn mozzarella that goes beautifully stringy in the oven, and whatever toppings the table decides on. The best pizzas happen when everyone makes their own.",kidNote:"Letting children choose and arrange their own toppings is the whole point — they eat everything when they've made it themselves",
 ingredients:["2 naan breads or pizza bases","4 tbsp passata","200g mozzarella","100g ham","1 pepper","sweetcorn"],
 steps:["Preheat oven to 230°C / 210°C fan — a very hot oven is what gives you blistered, restaurant-style bases rather than pale, doughy ones.","Lay naan breads or pizza bases on baking trays. Spread 2 tbsp of passata per base, leaving a 1cm border clear — this becomes the crisp, untopped crust.","Season the passata with a pinch of salt and pepper. Tear mozzarella into rough chunks and scatter over.","Add ham, finely diced pepper and sweetcorn. Don't over-pile — too many toppings makes the base soggy.","Bake for 10–12 min until the cheese is deeply golden and bubbling and the edges of the base have gone dark and crisp. Rest 2 min before slicing."],
 tip:"Less is more with toppings — a thin layer of passata and a modest amount of cheese allows the base to crisp properly; loaded pizzas steam from the inside and stay pale and soft no matter how long you bake them."},

{name:"Fish Pie",time:"40 min",minutes:40,protein:"fish",cuisine:"british",seasons:["autumn","winter"],serves:4,
 description:"Flakes of tender fish and sweet peas in a silky, lightly seasoned béchamel, blanketed under a crown of golden, cheesy mash. Deeply comforting in the way only a proper British pie can be.",kidNote:"Soft, mild and easy for young children — check carefully for any stray bones in the fish mix",
 ingredients:["400g fish pie mix","500g potatoes","200ml milk","30g butter","80g cheddar cheese","1 tbsp plain flour","100g frozen peas"],
 steps:["Peel and chop potatoes into even chunks and boil in well-salted water until completely tender when pierced, about 20 min. Drain thoroughly — any water in the mash will make it loose and wet. Mash with half the butter and a splash of the milk until smooth and creamy. Season generously. Preheat oven to 200°C / 180°C fan.","Melt the remaining butter in a saucepan over medium heat. Add flour and stir constantly for 1 min until the mixture turns a pale sand colour. This cooks out the raw flour taste.","Remove from heat and gradually whisk in the remaining milk, a little at a time, fully incorporating each addition before adding the next. Return to medium heat and stir continuously until the sauce thickens to a consistency that coats the back of a spoon, about 5 min. Season well.","Gently fold the fish pie mix and frozen peas into the sauce — handle lightly so the fish stays in large flakes rather than breaking up completely. Pour into a 20×30cm ovenproof dish.","Spoon the mash in an even layer over the filling, then use a fork to rough up the surface into ridges — these catch in the oven and become the crispy, golden peaks. Scatter with grated cheddar. Bake for 20–25 min until the topping is deep golden and the filling is bubbling at the edges."],
 tip:"Roughing up the mash topping with a fork before baking dramatically increases the surface area that crisps and browns — a smooth, flat surface just stays pale while the ridges go golden and crunchy."},

{name:"Sausage Pasta Bake",time:"35 min",minutes:35,protein:"pork",cuisine:"italian",seasons:["autumn","winter"],serves:4,
 description:"Nuggets of herby sausage meat and ridged penne baked in a rich tomato sauce under a crust of golden, bubbling cheddar. Proper weeknight comfort food that also happens to be brilliant made ahead.",kidNote:"The sausage balls are the perfect size for small children — soft, saucy and easy to eat",
 ingredients:["6 pork sausages","300g penne","400g tin chopped tomatoes","100g cheddar cheese","1 onion","1 tsp dried mixed herbs","1 tbsp olive oil"],
 steps:["Preheat oven to 200°C / 180°C fan. Cook penne in well-salted boiling water for 2 min less than the pack suggests — it will finish cooking in the oven and you want it with some bite when it goes in.","Squeeze the sausage meat from the skins and roll into rough balls, about the size of a large marble. Heat olive oil in a wide, oven-safe pan over medium-high heat and brown the balls in batches for 3–4 min, turning, until golden all over. Don't overcrowd the pan.","Remove the sausage balls and set aside. In the same pan, fry the finely diced onion over medium heat for 3–4 min until soft. Add tomatoes, herbs, salt and pepper; simmer 5 min.","Add the drained pasta and sausage balls to the sauce; stir to combine. Pour into a baking dish if not using an oven-safe pan. Taste and season the mixture before it goes under the cheese.","Scatter cheddar evenly over the top. Bake for 15–20 min until the cheese is deep golden and the sauce is bubbling around the edges."],
 tip:"Browning the sausage balls in batches with space between them — rather than adding them all at once — is essential; a crowded pan creates steam and you get grey, boiled sausage balls instead of caramelised, flavourful ones."},

{name:"Lamb Kofta Pittas",time:"30 min",minutes:30,protein:"lamb",cuisine:"middleeastern",seasons:["spring","summer"],serves:4,
 description:"Fragrant cumin and coriander-spiced lamb koftas — juicy inside, charred at the edges — tucked into warm pittas with cool cucumber and a cool yoghurt drizzle. The smell alone is worth it.",kidNote:"Flatten koftas into small patties for young children — they're easier to hold and eat in a pitta",
 ingredients:["400g lamb mince","4 pitta breads","1 tsp ground cumin","1 tsp ground coriander","4 tbsp natural yoghurt","1 cucumber","1 tbsp olive oil"],
 steps:["Combine lamb mince, cumin, coriander, a generous pinch of salt and plenty of black pepper in a bowl. Mix with your hands until the spices are evenly distributed — don't over-mix or the koftas can become dense.","Shape the mixture into 12 small oval koftas, pressing firmly so they hold together during cooking. Brush or drizzle with a little olive oil.","Cook under a preheated hot grill, or in a frying pan over medium-high heat, turning every 3–4 min for a total of 10–12 min, until cooked through and well-browned on the outside. A little char on the edges is desirable.","While koftas cook, warm pittas in the oven or under the grill for 2–3 min. Slice cucumber into thin rounds or sticks. Season the yoghurt with a pinch of salt and a squeeze of lemon if you have it.","Stuff pittas with koftas and cucumber, and drizzle with yoghurt. Eat immediately."],
 tip:"Chilling the shaped koftas in the fridge for even 10 minutes before cooking helps them hold their shape under the heat — warm mince can fall apart in the pan if it goes straight from mixing to cooking."},

{name:"Jacket Potatoes",time:"45 min",minutes:45,protein:"veggie",cuisine:"british",seasons:["autumn","winter"],serves:4,
 description:"Potatoes with crackly, salty skin and a fluffy, steaming interior — paired with your choice of filling, there's nothing more satisfying. The secret is proper heat, a bare oven rack, and enough time.",kidNote:"Let children choose their own filling — involvement in the choice means they eat it enthusiastically",
 ingredients:["4 large baking potatoes","1 tin baked beans","1 tin tuna","100g cheddar cheese","3 tbsp mayonnaise","knob of butter"],
 steps:["Preheat oven to 220°C / 200°C fan — the highest reasonable heat is what produces crispy skin rather than leathery or soft skin. Scrub potatoes clean and dry thoroughly.","Prick each potato all over with a fork (at least 8 pricks per potato — unpicked potatoes can burst). Rub all over with a little oil and a generous pinch of flaky salt.","Place directly on the oven rack, not a tray — hot air circulating underneath is what crisps the skin all around rather than leaving the base soggy. Bake for 40–45 min until the skin is shatteringly crisp and a skewer slides in with no resistance.","While potatoes bake, drain and flake the tuna; mix with mayo and season well. Heat beans in a small pan until bubbling. Grate the cheddar.","Remove from the oven and immediately cut a deep cross in each potato. Squeeze the sides to open up the centre, then add a knob of butter. Fill generously."],
 tip:"Baking the potatoes directly on the oven rack (not on a tray) allows hot air to circulate underneath — baking on a tray traps steam under the potato and prevents the base from crisping."},

{name:"Chicken & Veg Traybake",time:"35 min",minutes:35,protein:"chicken",cuisine:"british",seasons:["autumn","winter"],serves:4,
 description:"Golden, paprika-rubbed drumsticks and caramelised potatoes, peppers and courgette — all roasted together in one tray until everything is sticky at the edges and fragrant with garlic. Minimal effort, maximum reward.",kidNote:"Drumsticks are natural finger food — children can hold the bone and eat directly, which they tend to love",
 ingredients:["8 chicken drumsticks","500g baby potatoes","2 peppers","1 courgette","2 tbsp olive oil","1 tsp garlic granules","1 tsp smoked paprika"],
 steps:["Preheat oven to 220°C / 200°C fan. Halve baby potatoes; cut peppers into chunky strips and dice courgette into 2cm pieces. Dry the drumsticks thoroughly with kitchen paper.","In a large roasting tin, toss the potatoes with 1 tbsp olive oil, garlic granules, half the paprika, salt and pepper until evenly coated.","Rub the drumsticks with the remaining oil, paprika, salt and pepper. Nestle them among the potatoes in the tin, skin-side up, with space around each one.","Roast for 20 min. Add peppers and courgette to the tin, toss with the pan juices, and return for a further 15 min until the chicken skin is deep golden and the vegetables are tender and caramelised at the edges.","Check the chicken is cooked through — the juices should run completely clear when the thickest part of a drumstick is pierced with a skewer. Serve from the tray."],
 tip:"Patting the drumsticks dry and giving them space in the tin — rather than packing them tightly — allows the oven's heat to circulate and the skin to roast rather than steam, which is the difference between crispy and flabby."},

{name:"Beef Tacos",time:"25 min",minutes:25,protein:"beef",cuisine:"mexican",serves:4,
 description:"Richly spiced, deeply savoury beef mince spooned into crunchy shells and topped with sharp cheddar, cool sour cream and fresh salsa — a table-centre meal that everyone customises and nobody complains about.",kidNote:"For toddlers, break the taco shell and serve the mince in a bowl with cheese and mild salsa — the filling is what they love anyway",
 ingredients:["400g beef mince","8 taco shells","1 pack taco seasoning","1 little gem lettuce","80g cheddar cheese","4 tbsp salsa","4 tbsp sour cream"],
 steps:["Heat a wide pan over high heat with no oil — the mince has enough fat. Add the beef mince and spread flat. Leave untouched for 2 min until the underside is deeply browned, then break up with a spoon and stir, cooking a further 3 min until all the mince is brown, not grey.","Tilt the pan and spoon away any excess fat — a dry, seasoned mince is more flavourful than one sitting in grease.","Add taco seasoning and 4 tbsp water; stir and simmer over medium heat for 5 min until the liquid absorbs and the mince is glossy and well-coated.","Warm taco shells per pack (usually 2–3 min in a hot oven). Shred the lettuce; grate the cheddar. Set everything out in the middle of the table.","Let everyone fill their own shells. The order matters: shell, mince, cheese (so it melts), then lettuce, salsa and sour cream on top."],
 tip:"Browning the mince without stirring for the first couple of minutes — then draining the fat — concentrates the beef flavour and prevents the taco filling from being greasy and wet."},

{name:"Veggie Curry & Naan",time:"30 min",minutes:30,protein:"veggie",cuisine:"indian",seasons:["autumn","winter"],serves:4,
 description:"Creamy, gently spiced coconut curry with soft sweet potato and hearty chickpeas, wilted through with spinach and served with warm, pillowy naan for tearing and dipping. Warming, comforting and completely plant-based.",kidNote:"Mild and naturally sweet from the coconut and sweet potato — a curry most young children take to readily",
 ingredients:["1 tin chickpeas","1 sweet potato","400g tin coconut milk","2 tbsp korma paste","100g spinach","4 naan breads","250g rice"],
 steps:["Cook rice per pack instructions. Peel and dice sweet potato into 1.5cm cubes — try to keep them even so they cook at the same rate. Microwave with a splash of water for 4 min until just tender but holding their shape.","Heat a dry large pan over medium heat. Add korma paste and fry, stirring constantly, for 1–2 min until fragrant and slightly deepened in colour — frying the paste in a dry pan wakes up the spices before the liquid goes in.","Add the diced sweet potato and drained chickpeas to the pan; stir to coat in the paste.","Pour in the coconut milk and stir well. Bring to a gentle simmer over medium heat and cook for 12–15 min, stirring occasionally, until the sauce has thickened slightly and the sweet potato is completely tender.","Add the spinach in large handfuls, stirring between additions, and cook for 1–2 min until wilted. Taste and season with salt. Warm naan breads in the oven or microwave and serve alongside."],
 tip:"Frying the korma paste in a dry pan for a full minute or two before adding any liquid — until it smells fragrant and deepens slightly — is the step that takes curry from flat and mild to genuinely aromatic."},

{name:"Pasta al Forno",time:"40 min",minutes:40,protein:"beef",cuisine:"italian",seasons:["autumn","winter"],serves:4,
 description:"Rigatoni tubes packed with rich, herby beef ragu and topped with torn mozzarella that goes blistered and golden in the oven — the baked pasta dish that earns its place on the weekend table every single time.",kidNote:"Children tend to love this — the cheese topping and saucy pasta make it a natural crowd-pleaser",
 ingredients:["400g rigatoni","400g beef mince","400g tin chopped tomatoes","125g mozzarella","1 onion","1 tsp dried oregano","1 tbsp olive oil"],
 steps:["Preheat oven to 200°C / 180°C fan. Finely dice the onion. Heat olive oil in a wide pan over medium heat and soften the onion for 3–4 min, stirring, until translucent and smelling sweet.","Increase heat to high. Add the beef mince and flatten across the pan — leave undisturbed for 2 min to develop a deep brown crust, then break up and continue cooking until no pink remains and the mince is properly browned, not just grey.","Add the chopped tomatoes, oregano, a generous amount of salt and plenty of black pepper. Simmer over medium heat for 10 min, stirring occasionally, until the sauce has thickened and deepened in flavour.","Cook rigatoni in well-salted water for 2 min less than the pack instructions — it will finish in the oven. Drain and toss with the sauce in a large baking dish.","Tear mozzarella into rough pieces and scatter over the top. Bake for 15–20 min until the mozzarella is golden and blistered and the sauce is bubbling at the edges. Rest 5 min before serving."],
 tip:"Undercooking the rigatoni by 2 minutes before baking is essential — pasta that's fully cooked before going into the oven overcooks and turns soft and stodgy as it bakes in the sauce."},

{name:"Sticky Chicken Drumsticks",time:"35 min",minutes:35,protein:"chicken",cuisine:"asian",serves:4,
 description:"Caramelised drumsticks glazed in a sticky honey, soy and ketchup lacquer that clings in dark, sweet shards to the crispy skin — served with fluffy rice and tender broccoli. Fingers will be licked.",kidNote:"The sweet glaze makes these very appealing to children — bring plenty of napkins and lean into the mess",
 ingredients:["8 chicken drumsticks","2 tbsp honey","2 tbsp soy sauce","1 tbsp ketchup","250g rice","1 head broccoli"],
 steps:["Preheat oven to 200°C / 180°C fan. Pat drumsticks completely dry with kitchen paper — this is the critical step for crispy skin and a glaze that sticks rather than slides off.","Mix honey, soy sauce and ketchup in a bowl until combined. Season with black pepper (the soy provides the salt). Toss the drumsticks in the marinade until evenly coated.","Arrange drumsticks in a roasting tin with space between each one — touching drumsticks steam each other rather than caramelising. Roast for 20 min.","Spoon any glaze pooled in the tin back over the drumsticks. Return to the oven for 12–15 min more until the glaze is deeply caramelised and the skin is lacquered and sticky. The juices should run clear.","Cook rice per pack. Break broccoli into small florets and steam or boil for 4–5 min until just tender. Serve everything alongside."],
 tip:"Basting the drumsticks halfway through with the pooled glaze in the tin builds up the lacquered, sticky layers — each baste adds another coat of caramelised flavour rather than leaving a thin, watery finish."},

{name:"Thai Green Chicken Curry",time:"30 min",minutes:30,protein:"chicken",cuisine:"asian",serves:4,
 description:"Silky coconut milk curry fragrant with lemongrass, galangal and green chilli — with tender chicken and sweet peas, served over jasmine rice that soaks up every drop of the sauce. Light yet deeply satisfying.",kidNote:"Use a mild Thai green paste for young children — the coconut milk tempers the heat but taste before serving",
 ingredients:["3 chicken breasts","400g tin coconut milk","2 tbsp Thai green curry paste","150g frozen peas","250g jasmine rice","1 tbsp vegetable oil","1 lime"],
 steps:["Cook jasmine rice per pack instructions and keep warm.","Slice chicken breasts into bite-sized pieces, roughly 3cm — even sizes mean they cook at the same rate. Season lightly with salt.","Heat oil in a wide pan or wok over medium-high heat. Add the chicken pieces in a single layer and cook for 3–4 min until lightly golden. Remove and set aside.","Add the curry paste to the pan and fry, stirring constantly, for 1–2 min until deeply fragrant — you'll smell the lemongrass and spices bloom. This step is what gives the curry its depth.","Pour in coconut milk, scraping up any paste from the pan base. Add the chicken back and simmer gently for 8–10 min until cooked through. Add peas in the last 3 min. Squeeze in half the lime, taste and adjust seasoning. Serve over rice with remaining lime wedges."],
 tip:"Frying the curry paste in a dry pan for a full 1–2 minutes before adding coconut milk releases the essential oils in the spices and aromatics, giving you a fragrant, layered curry rather than a one-dimensional one."},

{name:"Sheet Pan Salmon & Veg",time:"30 min",minutes:30,protein:"fish",cuisine:"british",seasons:["spring","summer"],serves:4,
 description:"Salmon fillets roasted to just-done perfection on a tray of caramelised new potatoes, sweet cherry tomatoes and tender courgette, all finished with a squeeze of lemon. Spring and summer on a single tray.",kidNote:"Everything is soft and mild — flake the salmon away from the skin into smaller pieces for young children",
 ingredients:["4 salmon fillets","500g new potatoes","2 courgettes","200g cherry tomatoes","2 tbsp olive oil","1 lemon","1 tsp garlic granules"],
 steps:["Preheat oven to 200°C / 180°C fan. Halve new potatoes and toss in a large baking tray with 1 tbsp olive oil, garlic granules, salt and pepper. Roast for 15 min until starting to turn golden.","Dice courgettes into 2cm pieces. Add courgette and cherry tomatoes to the tray, tossing with the potatoes and pan juices.","Pat the salmon fillets dry — dry fish is what gives you a golden, slightly caramelised surface rather than pale, steamed fish. Lay skin-side down on the tray among the vegetables. Drizzle with remaining olive oil and season with salt and pepper.","Squeeze half the lemon over everything. Roast for a further 12–15 min until the salmon is just cooked through — it should be opaque all the way through but still slightly yielding when pressed.","Squeeze over the remaining lemon and serve straight from the tray."],
 tip:"Salmon is done the moment it turns opaque all the way through — a minute or two beyond this and it becomes dry and chalky; check at 12 minutes and remove it the moment it resists slightly when pressed in the thickest part."},

{name:"Shakshuka",time:"25 min",minutes:25,protein:"eggs",cuisine:"middleeastern",serves:4,
 description:"Eggs nestled into a vivid, aromatic sauce of slow-cooked peppers, onion and spiced tomatoes — the whites just set, the yolks still running golden when you break them with bread. A dish that looks spectacular and asks almost nothing of you.",kidNote:"Eggs in a mild sauce with bread for dipping is a combination that works brilliantly for children — set firm if small children prefer their eggs fully cooked",
 ingredients:["6 eggs","2 tins chopped tomatoes","2 peppers","1 onion","2 tsp smoked paprika","1 tsp cumin","1 tbsp olive oil","bread for serving"],

/* ── Utilities ────────────────────────────────────────────────────────────── */
function getSeason(){var m=new Date().getMonth();if(m>=2&&m<=4)return'spring';if(m>=5&&m<=7)return'summer';if(m>=8&&m<=10)return'autumn';return'winter';}

function smartPick(pool,count,opts){
  if(count<=0)return[];
  var history=opts.history||[],favs=opts.favourites||[],dis=opts.dislikes||[];
  var season=getSeason(),now=Date.now(),WEEK=7*24*60*60*1000;
  var avail=pool.filter(function(m){return!dis.includes(m.name)});
  if(avail.length<count)avail=pool;
  var scored=avail.map(function(m){
    var s=1,uses=history.filter(function(h){return h.name===m.name});
    if(uses.length){var wa=(now-Math.max.apply(null,uses.map(function(h){return h.date})))/WEEK;if(wa<1.5)s*=0.02;else if(wa<3)s*=0.2;else if(wa<5)s*=0.55;}
    if(favs.includes(m.name))s*=2.5;
    if(m.seasons&&m.seasons.includes(season))s*=1.4;
    return{m:m,s:s};
  });
  var selected=[],usedP={},usedC={};
  for(var i=0;i<count;i++){
    var remaining=scored.filter(function(x){return!selected.some(function(s){return s.name===x.m.name})});
    if(!remaining.length)break;
    var adj=remaining.map(function(x){
      var w=Math.max(x.s,0.001),pc=usedP[x.m.protein]||0,cc=usedC[x.m.cuisine]||0;
      if(pc>=2)w*=0.08;else if(pc===1)w*=0.5;
      if(cc>=2)w*=0.12;else if(cc===1)w*=0.6;
      return{m:x.m,w:Math.max(w,0.001)};
    });
    var total=adj.reduce(function(a,x){return a+x.w},0),rand=Math.random()*total,chosen=adj[adj.length-1].m;
    for(var j=0;j<adj.length;j++){rand-=adj[j].w;if(rand<=0){chosen=adj[j].m;break;}}
    selected.push(chosen);usedP[chosen.protein]=(usedP[chosen.protein]||0)+1;usedC[chosen.cuisine]=(usedC[chosen.cuisine]||0)+1;
  }
  return selected;
}

function scaledIngredients(ingredients,scale){
  return(ingredients||[]).map(function(str){
    var m=str.match(/^(\d+(?:\.\d+)?)\s*(g|kg|ml|l|tbsp|tsp|x|)\b\s*(.+)$/i);
    if(!m)return{qty:'',label:str,display:str};
    var num=parseFloat(m[1])*scale,rounded=num%1<0.1||num%1>0.9?Math.round(num):parseFloat(num.toFixed(1));
    var u=(m[2]||'').toLowerCase(),label=m[3].trim();
    var sp=['g','kg','ml','l'].includes(u)?'':' ';
    var display=u?(rounded+sp+u+' '+label):(rounded+' '+label);
    return{qty:rounded+(u?sp+u:''),label:label,display:display};
  });
}

function categoriseItem(label){
  var s=label.toLowerCase();
  if(/\bchicken\b|breast|thigh|drumstick|goujon|beef mince|turkey mince|\bpork\b|sausage|\blamb\b|salmon|\bfish\b|prawn|\btuna\b|meatball|bacon|\bham\b/.test(s))return'Meat & Fish';
  if(/\bcheese\b|\bmilk\b|\bbutter\b|cream|egg|yoghurt|crème fraîche|mozzarella|parmesan/.test(s))return'Dairy & Eggs';
  if(/frozen/.test(s))return'Frozen';
  if(/\btin\b|passata|baked bean|stock|coconut milk|chopped tomato|soy sauce|teriyaki|sweet chilli|ketchup|mayo|mayonnaise|mustard|paste|olive oil|vegetable oil|sesame oil|honey|plain flour|mixed herb|oregano|paprika|cumin|coriander|garlic granule|fajita|taco season/.test(s))return'Tins & Pantry';
  if(/pasta|penne|spaghetti|fusilli|rigatoni|orzo|macaroni|noodle|\brice\b/.test(s))return'Pasta, Rice & Grains';
  if(/bread|tortilla|pitta|naan|pizza base|taco shell|\bwrap\b/.test(s))return'Bread & Wraps';
  return'Fresh Produce';
}

function buildShop(plan,pantry,familySize){
  var pw=(pantry||'').toLowerCase().split(/[,\n]/).map(function(s){return s.trim()}).filter(Boolean);
  var seen=new Set(),items=[];
  plan.meals.forEach(function(m){
    var scale=familySize/(m.serves||4);
    scaledIngredients(m.ingredients,scale).forEach(function(ing){
      var lc=ing.label.toLowerCase();
      if(seen.has(lc))return;
      if(pw.some(function(w){return lc.includes(w)||ing.display.toLowerCase().includes(w)}))return;
      seen.add(lc);items.push({display:ing.display,category:categoriseItem(lc)});
    });
  });
  var result={};CATEGORY_ORDER.forEach(function(c){result[c]=[]});
  items.forEach(function(item){(result[item.category]||(result['Fresh Produce'])).push(item)});
  var out={};CATEGORY_ORDER.forEach(function(c){if(result[c]&&result[c].length)out[c]=result[c]});
  return out;
}

function getPool(type,timeFilter,customMeals){
  var base=type==='weekend'?WEEKEND_MEALS:WEEKDAY_MEALS;
  var custom=(customMeals||[]).filter(function(m){return type==='weekday'?m.pool!=='weekend':m.pool!=='weekday'});
  var limit=timeFilter==='15'?15:timeFilter==='25'?25:Infinity;
  return[].concat(base,custom).filter(function(m){return m.minutes<=limit});
}

function nextDateForDayName(dayName){
  var idx=DAYS.indexOf(dayName),today=new Date(),todayDow=(today.getDay()+6)%7,diff=(idx-todayDow+7)%7;
  if(diff===0)diff=7;var d=new Date(today);d.setDate(today.getDate()+diff);return d;
}
function toICSDate(d){return''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');}
function generateICS(plan){
  var uid=Date.now(),lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Family Meal Planner//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  plan.meals.forEach(function(meal,i){
    var d=nextDateForDayName(meal.day),ds=toICSDate(d),nd=new Date(d);nd.setDate(d.getDate()+1);
    lines.push('BEGIN:VEVENT','UID:meal-'+uid+'-'+i+'@mealplanner','SUMMARY:Dinner: '+meal.name,
      'DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+toICSDate(nd),
      'DESCRIPTION:'+(meal.description||'').replace(/,/g,'\\,').slice(0,70),'END:VEVENT');
  });
  lines.push('END:VCALENDAR');return lines.join('\r\n');
}
function downloadICS(plan){
  var content=generateICS(plan),blob=new Blob([content],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='meal-plan.ics';document.body.appendChild(a);a.click();
  document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

function encodePlan(plan,dayConfig,familySize,customMeals){
  var usedCustom=plan.meals.filter(function(m){return m.custom});
  var payload={v:1,d:dayConfig,f:familySize,m:plan.meals.map(function(m){return{n:m.name,dy:m.day}}),cm:usedCustom.length?usedCustom:undefined};
  try{return btoa(unescape(encodeURIComponent(JSON.stringify(payload))))}catch(e){return btoa(JSON.stringify(payload))}
}
function decodePlan(encoded,allBuiltin){
  try{
    var payload=JSON.parse(decodeURIComponent(escape(atob(encoded))));
    if(!payload||!payload.m)return null;
    var all=[].concat(allBuiltin,payload.cm||[]);
    var meals=payload.m.map(function(x){
      var found=all.find(function(m){return m.name===x.n});
      return found?Object.assign({},found,{day:x.dy}):{name:x.n,day:x.dy,description:'Shared meal',ingredients:[],steps:[],time:'',minutes:0,protein:'',cuisine:'',serves:4};
    });
    return{meals:meals,dayConfig:payload.d||DEFAULT_DAY_CFG,familySize:payload.f||4};
  }catch(e){return null;}
}
</script>
